                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    <button
                      onClick={requestUnlock}
                      disabled={user.profileEditRequested}
                      style={{
                        flex: 1,
                        background: user.profileEditRequested ? T.gray : `linear-gradient(135deg, ${T.indigo}, ${T.purple})`,
                        color: user.profileEditRequested ? T.muted : "#fff",
                        border: "none",
                        borderRadius: 10,
                        padding: "11px 16px",
                        fontSize: 13,
                        fontWeight: 700,
                        cursor: user.profileEditRequested ? "not-allowed" : "pointer",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        gap: 8,
                        boxShadow: user.profileEditRequested ? "none" : "0 4px 12px rgba(99,102,241,0.3)"
                      }}
                    >
                      <span className="material-symbols-outlined" style={{ fontSize: 18 }}>
                        {user.profileEditRequested ? "pending_actions" : "lock_open"}
                      </span>
                      {user.profileEditRequested ? "Unlock Request Pending..." : "Request Admin to Re-edit Profile"}
                    </button>

                    {user.profileEditRequested && (
                      <button
                        onClick={handleRefreshStatus}
                        style={{
                          background: "#fff",
                          color: T.indigo,
                          border: `1px solid ${T.indigo}40`,
                          borderRadius: 10,
                          padding: "11px",
                          cursor: "pointer",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center"
                        }}
                        title="Refresh Status"
                      >
                        <span className="material-symbols-outlined" style={{ fontSize: 20 }}>refresh</span>
                      </button>
                    )}
                  </div>
                )}

              </div>
            )}
            <Btn onClick={onLogout} variant="ghost" style={{ width: "100%", padding: 14, fontSize: 15, marginTop: 8, borderColor: "#EF4444", color: "#EF4444" }}>
              🚪 Log Out
            </Btn>
          </div>
        </Modal>
      );
    }

    /* ══════════════════════════════════════
      MODULE: VIDYA-SETU (Pre-Flight)
    ══════════════════════════════════════ */
    function VidyaSetu() {
      const { user } = useUser();
      const addToast = useToast();

      const [aktuStep, setAktuStep] = useState(1);
      const [aktuLoading, setAktuLoading] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [aktuStatus, setAktuStatus] = useState("Draft");
      const [instituteRemark, setInstituteRemark] = useState("");
      const [uploadedDocs, setUploadedDocs] = useState({});

      const [aktuOtr, setAktuOtr] = useState({ aadhaarNumber: '', fullName: user?.name || '', dob: '2004-05-15', mobileNumber: '', category: user?.casteCategory || 'General', securityPin: '' });
      const [aktuApp, setAktuApp] = useState({ districtOfCollege: '', collegeName: '', courseName: '', branch: '', entryMode: 'Regular', currentYearOfStudy: '', enrollmentNumber: '', rollNumber: '', rank: '', hsBoard: '', hsYear: '', hsRoll: '', hsMarks: '', hsTotal: '', intBoard: '', intYear: '', intRoll: '', intMarks: '', intTotal: '', feeAmount: '', incNumber: '', incAppNumber: '', casteNumber: '', casteAppNumber: '' });

      useEffect(() => {
        const fetchExisting = async () => {
          if (!user?._id) return;
          try {
            const res = await fetch(`${API_BASE_URL}/api/scholarships/aktu-application/${user._id}`);
            const data = await res.json();
            if (data.success && data.app) {
              setAktuApp(data.app);
              setAktuStatus(data.app.applicationStatus);
              setInstituteRemark(data.app.instituteRemark || "");
              if (data.app.applicationStatus !== 'Draft') {
                setIsSubmitted(true);
              }
            }
          } catch (e) { }
        };
        fetchExisting();
      }, [user]);

      const inputSt = { width: "100%", padding: "12px 14px", background: "#F9FAFB", color: T.text, border: `1px solid ${T.border}`, borderRadius: 10, fontSize: 14 };

      const submitForm = async () => {
        const requiredAppFields = [
          'districtOfCollege', 'collegeName', 'courseName', 'branch', 'entryMode', 'currentYearOfStudy', 'enrollmentNumber', 'rollNumber', 'rank',
          'hsBoard', 'hsYear', 'hsRoll', 'hsMarks', 'hsTotal',
          'intBoard', 'intYear', 'intRoll', 'intMarks', 'intTotal',
          'feeAmount', 'incNumber', 'incAppNumber'
        ];

        for (const field of requiredAppFields) {
          if (!aktuApp[field] || String(aktuApp[field]).trim() === '') {
            addToast("Incomplete Form", "Please fill all the details before locking your application.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.rose);
            return;
          }
        }

        if (aktuOtr.category !== 'General') {
          if (!aktuApp.casteNumber || String(aktuApp.casteNumber).trim() === '' || !aktuApp.casteAppNumber || String(aktuApp.casteAppNumber).trim() === '') {
            addToast("Incomplete Form", "Please fill all your caste certificate details.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.rose);
            return;
          }
        }
        setAktuLoading(true);
        try {
          const payload = {
            studentReference: user._id || "TEST_ID",
            applicationStatus: 'Locked_by_Student',
            ...aktuApp,
            highSchool: { board: aktuApp.hsBoard, passingYear: aktuApp.hsYear, rollNumber: aktuApp.hsRoll, marksObtained: aktuApp.hsMarks, totalMarks: aktuApp.hsTotal },
            intermediate: { board: aktuApp.intBoard, passingYear: aktuApp.intYear, rollNumber: aktuApp.intRoll, marksObtained: aktuApp.intMarks, totalMarks: aktuApp.intTotal },
            nonRefundableFeeAmount: aktuApp.feeAmount,
            incomeCertificate: { number: aktuApp.incNumber, applicationNumber: aktuApp.incAppNumber },
            casteCertificate: { number: aktuApp.casteNumber, applicationNumber: aktuApp.casteAppNumber },
            documents: {
              passportPhoto: uploadedDocs["Passport Photo"] || null,
              incomeCertificate: uploadedDocs["Income Certificate"] || null,
              tenthMarksheet: uploadedDocs["Tenth Marksheet"] || null,
              twelfthMarksheet: uploadedDocs["Twelfth Marksheet"] || null,
              feeReceipt: uploadedDocs["Fee Receipt"] || null
            }
          };
          const res = await fetch(`${API_BASE_URL}/api/scholarships/aktu-application`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success || res.ok) {
            addToast("Success", "Application locked & forwarded!", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, T.success);
            setAktuStatus("Locked_by_Student");
            setIsSubmitted(true);
          } else {
            addToast("Error", data.error || "Failed to submit", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.rose);
          }
        } catch (err) {
          addToast("Success", "Application forwarded (Mock)", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, T.success);
          setAktuStatus("Locked_by_Student");
          setIsSubmitted(true);
        }
        setAktuLoading(false);
      };

      return (
        <div>
          <div className="screen-hero" style={{ padding: "44px 44px 40px" }}>
            <div className="screen-hero-inner">
              <span style={{ display: "inline-block", background: T.indigo + "14", color: T.indigo, border: `1px solid ${T.indigo}30`, borderRadius: 12, padding: "4px 12px", fontSize: 12, fontWeight: 700, letterSpacing: 0.5 }}>🎓 AKTU Scholarship Portal</span>
              <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 32, fontWeight: 900, marginTop: 12, lineHeight: 1.15, color: T.text, letterSpacing: '-0.4px' }}>Scholarship Application</h1>
              <p style={{ color: T.muted, fontSize: 14, marginTop: 8, maxWidth: 500 }}>Fill out the official form. Your data will be securely sent to the UP Scholarship Backend.</p>
            </div>
          </div>

          <div className="screen-body">
            {isSubmitted ? (
              <div style={{ padding: "40px 24px", textAlign: "center", background: "#FFFFFF", borderRadius: 16, border: "1px solid #EBEBEB", boxShadow: "0 2px 16px rgba(0,0,0,0.05)" }}>
                {aktuStatus === 'Rejected_by_Institute' ? (
                  <>
                    <div style={{ fontSize: 48, marginBottom: 14 }}>⚠️</div>
                    <div style={{ fontWeight: 800, fontSize: 20, color: T.rose, marginBottom: 8 }}>Application Rejected by Institute</div>
                    <div style={{ color: T.muted, fontSize: 14, marginBottom: 24 }}>Your application requires corrections before it can be forwarded.</div>

                    <div style={{ maxWidth: 500, margin: "0 auto", padding: 16, background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 12, textAlign: "left", marginBottom: 24 }}>
                      <div style={{ fontWeight: 700, color: T.rose, marginBottom: 4 }}>Institute Remark:</div>
                      <div style={{ color: "#991B1B", fontSize: 14 }}>{instituteRemark}</div>
                    </div>

                    <Btn onClick={async () => {
                      const res = await fetch(`${API_BASE_URL}/api/scholarships/aktu-application`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ studentReference: user._id, applicationStatus: 'Draft' })
                      });
                      if (res.ok) {
                        setAktuStatus('Draft');
                        setIsSubmitted(false);
                        addToast("Form Unlocked", "You can now edit your details", "🔓", T.success);
                      }
                    }} variant="primary" style={{ padding: "12px 24px" }}>Unlock Form to Edit & Resubmit</Btn>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 48, marginBottom: 14 }}>🚀</div>
                    <div style={{ fontWeight: 800, fontSize: 20, color: T.success, marginBottom: 8 }}>Application Locked & Submitted</div>
                    <div style={{ color: T.muted, fontSize: 14, marginBottom: 24 }}>Your application is currently being processed.</div>

                    {/* Progress Tracker */}
                    <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 400, margin: "0 auto", textAlign: "left" }}>
                      {[
                        { id: 'Locked_by_Student', label: 'Form Locked by Student', icon: 'lock', done: true },
                        { id: 'Verified_by_Institute', label: 'Institute Verification', icon: 'account_balance', done: aktuStatus !== 'Locked_by_Student' && aktuStatus !== 'Draft' },
                        { id: 'Forwarded_to_District', label: 'District Committee', icon: 'verified', done: aktuStatus === 'Forwarded_to_District' },
                      ].map((s, i) => (
                        <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px", borderRadius: 12, background: s.done ? "rgba(34,197,94,0.08)" : "#F5F5F5", border: s.done ? "1px solid rgba(34,197,94,0.2)" : "1px solid #EEE" }}>
                          <span className="material-symbols-outlined" style={{ color: s.done ? T.success : "#CCC" }}>{s.icon}</span>
                          <span style={{ fontWeight: 600, color: s.done ? T.text : "#999" }}>{s.label}</span>
                          {s.done && <span style={{ marginLeft: "auto", color: T.success, fontWeight: 800 }}>✓</span>}
                        </div>
                      ))}
                    </div>
                  </>
                )}
              </div>
            ) : (
              <div style={{ maxWidth: 800, margin: "0 auto", padding: "24px", background: "#FFFFFF", borderRadius: 16, border: "1px solid #EBEBEB", boxShadow: "0 2px 16px rgba(0,0,0,0.05)" }}>
                {/* Step Indicators */}
                <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
                  {[1, 2, 3, 4].map(s => (
                    <div key={s} style={{ flex: 1, height: 6, borderRadius: 3, background: aktuStep >= s ? T.indigo : "#EEE" }} />
                  ))}
                </div>

                {aktuStep === 1 && (
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16, color: T.indigo }}>Step 1: OTR & Authentication</div>
                    <div className="grid-2">
                      <input style={inputSt} placeholder="Aadhaar Number" value={aktuOtr.aadhaarNumber} onChange={e => setAktuOtr(p => ({ ...p, aadhaarNumber: e.target.value }))} />
                      <input style={inputSt} placeholder="Full Name (DigiLocker)" value={aktuOtr.fullName} disabled />
                      <div>
                        <label style={{ fontSize: 10, color: T.muted, marginBottom: 4, display: "block" }}>Date of Birth (Aadhaar Verified)</label>
                        <input type="date" style={inputSt} value={aktuOtr.dob} onChange={e => setAktuOtr(p => ({ ...p, dob: e.target.value }))} />
                      </div>
                      <input style={inputSt} placeholder="Mobile Number" value={aktuOtr.mobileNumber} onChange={e => setAktuOtr(p => ({ ...p, mobileNumber: e.target.value }))} />
                      <select style={inputSt} value={aktuOtr.category} onChange={e => setAktuOtr(p => ({ ...p, category: e.target.value }))}>
                        <option value="General">General</option><option value="OBC">OBC</option><option value="SC">SC</option><option value="ST">ST</option><option value="Minority">Minority</option>
                      </select>
                      <input style={inputSt} type="password" placeholder="Security PIN (6 digits)" value={aktuOtr.securityPin} onChange={e => setAktuOtr(p => ({ ...p, securityPin: e.target.value }))} />
                    </div>
                    <Btn onClick={async () => {
                      setAktuLoading(true);
                      try {
                        await fetch(`${API_BASE_URL}/api/scholarships/aktu-otr`, {
                          method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ ...aktuOtr, otrStatus: true, userId: user._id })
                        });
                        setAktuStep(2);
                      } catch (err) {
                        setAktuStep(2); // continue anyway for UI preview
                      }
                      setAktuLoading(false);
                    }} variant="primary" style={{ width: "100%", marginTop: 24, padding: 14 }}>{aktuLoading ? "Saving..." : "Next Step →"}</Btn>
                  </div>
                )}

                {aktuStep === 2 && (
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16, color: T.indigo }}>Step 2: Institutional & Academic</div>
                    <div className="grid-2">
                      <input style={inputSt} placeholder="District of College" value={aktuApp.districtOfCollege} onChange={e => setAktuApp(p => ({ ...p, districtOfCollege: e.target.value }))} />
                      <input style={inputSt} placeholder="College Name / AKTU Code" value={aktuApp.collegeName} onChange={e => setAktuApp(p => ({ ...p, collegeName: e.target.value }))} />
                      <input style={inputSt} placeholder="Course Name (e.g., B.Tech)" value={aktuApp.courseName} onChange={e => setAktuApp(p => ({ ...p, courseName: e.target.value }))} />
                      <input style={inputSt} placeholder="Branch" value={aktuApp.branch} onChange={e => setAktuApp(p => ({ ...p, branch: e.target.value }))} />
                      <select style={inputSt} value={aktuApp.entryMode} onChange={e => setAktuApp(p => ({ ...p, entryMode: e.target.value }))}>
                        <option value="Regular">Regular</option><option value="Lateral Entry">Lateral Entry</option>
                      </select>
                      <input style={inputSt} placeholder="Current Year of Study" value={aktuApp.currentYearOfStudy} onChange={e => setAktuApp(p => ({ ...p, currentYearOfStudy: e.target.value }))} />
                      <input style={inputSt} placeholder="Enrollment Number" value={aktuApp.enrollmentNumber} onChange={e => setAktuApp(p => ({ ...p, enrollmentNumber: e.target.value }))} />
                      <input style={inputSt} placeholder="UPTAC/JEE Roll Number" value={aktuApp.rollNumber} onChange={e => setAktuApp(p => ({ ...p, rollNumber: e.target.value }))} />
                      <input style={inputSt} placeholder="UPTAC/JEE Rank" value={aktuApp.rank} onChange={e => setAktuApp(p => ({ ...p, rank: e.target.value }))} />
                    </div>
                    <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
                      <Btn onClick={() => setAktuStep(1)} variant="secondary" style={{ flex: 1, padding: 14 }}>← Back</Btn>
                      <Btn onClick={() => setAktuStep(3)} variant="primary" style={{ flex: 1, padding: 14 }}>Next Step →</Btn>
                    </div>
                  </div>
                )}

                {aktuStep === 3 && (
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16, color: T.indigo }}>Step 3: Past Education</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: T.muted, marginBottom: 8 }}>High School (Tenth)</div>
                    <div className="grid-2" style={{ marginBottom: 20 }}>
                      <select style={inputSt} value={aktuApp.hsBoard} onChange={e => setAktuApp(p => ({ ...p, hsBoard: e.target.value }))}>
                        <option value="">Select Board</option>
                        {EDUCATIONAL_BOARDS.map(b => <option key={b} value={b}>{b}</option>)}
                      </select>
                      <input style={inputSt} placeholder="Passing Year" value={aktuApp.hsYear} onChange={e => setAktuApp(p => ({ ...p, hsYear: e.target.value }))} />
                      <input style={inputSt} placeholder="Roll Number" value={aktuApp.hsRoll} onChange={e => setAktuApp(p => ({ ...p, hsRoll: e.target.value }))} />
                      <div style={{ display: "flex", gap: 8 }}>
                        <input style={inputSt} placeholder="Marks" value={aktuApp.hsMarks} onChange={e => setAktuApp(p => ({ ...p, hsMarks: e.target.value }))} />
                        <input style={inputSt} placeholder="Total" value={aktuApp.hsTotal} onChange={e => setAktuApp(p => ({ ...p, hsTotal: e.target.value }))} />
                      </div>
                    </div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: T.muted, marginBottom: 8 }}>Intermediate (Twelfth) / Diploma</div>
                    <div className="grid-2">
                      <select style={inputSt} value={aktuApp.intBoard} onChange={e => setAktuApp(p => ({ ...p, intBoard: e.target.value }))}>
                        <option value="">Select Board</option>
                        {EDUCATIONAL_BOARDS.map(b => <option key={b} value={b}>{b}</option>)}
                      </select>
                      <input style={inputSt} placeholder="Passing Year" value={aktuApp.intYear} onChange={e => setAktuApp(p => ({ ...p, intYear: e.target.value }))} />
                      <input style={inputSt} placeholder="Roll Number" value={aktuApp.intRoll} onChange={e => setAktuApp(p => ({ ...p, intRoll: e.target.value }))} />
                      <div style={{ display: "flex", gap: 8 }}>
                        <input style={inputSt} placeholder="Marks" value={aktuApp.intMarks} onChange={e => setAktuApp(p => ({ ...p, intMarks: e.target.value }))} />
                        <input style={inputSt} placeholder="Total" value={aktuApp.intTotal} onChange={e => setAktuApp(p => ({ ...p, intTotal: e.target.value }))} />
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
                      <Btn onClick={() => setAktuStep(2)} variant="secondary" style={{ flex: 1, padding: 14 }}>← Back</Btn>
                      <Btn onClick={() => setAktuStep(4)} variant="primary" style={{ flex: 1, padding: 14 }}>Next Step →</Btn>
                    </div>
                  </div>
                )}

                {aktuStep === 4 && (
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16, color: T.indigo }}>Step 4: Financial & Finalize</div>
                    <div className="grid-2">
                      <input style={inputSt} placeholder="Non-Refundable Fee Amount" value={aktuApp.feeAmount} onChange={e => setAktuApp(p => ({ ...p, feeAmount: e.target.value }))} />
                      <input style={inputSt} placeholder="Income Certificate Number" value={aktuApp.incNumber} onChange={e => setAktuApp(p => ({ ...p, incNumber: e.target.value }))} />
                      <input style={{ ...inputSt, gridColumn: "span 2" }} placeholder="Income Cert. App Number" value={aktuApp.incAppNumber} onChange={e => setAktuApp(p => ({ ...p, incAppNumber: e.target.value }))} />
                      {aktuOtr.category !== 'General' && (
                        <>
                          <input style={inputSt} placeholder="Caste Certificate Number" value={aktuApp.casteNumber} onChange={e => setAktuApp(p => ({ ...p, casteNumber: e.target.value }))} />
                          <input style={inputSt} placeholder="Caste Cert. App Number" value={aktuApp.casteAppNumber} onChange={e => setAktuApp(p => ({ ...p, casteAppNumber: e.target.value }))} />
                        </>
                      )}
                    </div>

                    <div style={{ marginTop: 20, marginBottom: 10 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: T.muted, marginBottom: 8 }}>Upload Documents</div>
                      <div className="grid-2">
                        {["Passport Photo", "Income Certificate", "Tenth Marksheet", "Twelfth Marksheet", "Fee Receipt"].map(doc => {
                          const expectedExt = doc === "Passport Photo" ? ".jpg" : ".pdf";
                          const expectedName = doc.replace(/\s+/g, "_") + expectedExt;
                          const isUploaded = uploadedDocs[doc];
                          return (
                            <div key={doc} style={{ display: "flex", alignItems: "center", gap: 10, padding: 8, border: isUploaded ? `1.5px solid ${T.success}88` : "1px dashed #CCC", background: isUploaded ? `${T.success}08` : "transparent", borderRadius: 8, transition: "all 0.3s" }}>
                              <span className="material-symbols-outlined" style={{ color: isUploaded ? T.success : T.muted }}>{isUploaded ? "check_circle" : "upload_file"}</span>
                              <span style={{ fontSize: 12, color: T.text, flex: 1, fontWeight: isUploaded ? 600 : 400 }}>{doc}</span>
                              {!isUploaded ? (
                                <input type="file" style={{ fontSize: 10, width: 80 }} accept={doc === "Passport Photo" ? ".jpg,.jpeg" : ".pdf"} onChange={(e) => {
                                  const file = e.target.files[0];
                                  if (!file) return;
                                  const isPhoto = doc === "Passport Photo";
                                  const isJpg = file.name.toLowerCase().endsWith('.jpg') || file.name.toLowerCase().endsWith('.jpeg');
                                  const isPdf = file.name.toLowerCase().endsWith('.pdf');

                                  if (isPhoto && !isJpg) {
                                    addToast("Invalid Format", "Passport size photo must be a .jpg file.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.rose);
                                    e.target.value = '';
                                    return;
                                  }
                                  if (!isPhoto && !isPdf) {
                                    addToast("Invalid Format", `${doc} must be a .pdf file.`, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.rose);
                                    e.target.value = '';
                                    return;
                                  }

                                  const normalizedFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "").toLowerCase();
                                  const expectedBase = doc.replace(/\s+/g, "").toLowerCase();
                                  if (!normalizedFileName.includes(expectedBase)) {
                                    addToast("Invalid File Name", `You must upload your file with its related name (e.g., ${expectedName}).`, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.orange);
                                    e.target.value = '';
                                    return;
                                  }

                                  const reader = new FileReader();
                                  reader.onload = (upload) => {
                                    setUploadedDocs(p => ({ ...p, [doc]: upload.target.result }));
                                    addToast("File Attached", `${file.name} ready for upload.`, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, T.success);
                                  };
                                  reader.readAsDataURL(file);
                                }} />
                              ) : (
                                <button onClick={() => setUploadedDocs(p => ({ ...p, [doc]: false }))} style={{ border: "none", background: "none", color: T.rose, cursor: "pointer", fontSize: 10, fontWeight: 700 }}>Remove</button>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div style={{ marginTop: 20, padding: 16, background: "#FFFBEB", border: "1px dashed rgba(245,158,11,0.3)", borderRadius: 12 }}>
                      <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                        <input type="checkbox" id="declare" style={{ marginTop: 4, width: 18, height: 18 }} />
                        <label htmlFor="declare" style={{ fontSize: 13, color: "#92400E", lineHeight: 1.5 }}>
                          I hereby declare that all information provided is accurate and authentic. I understand that my form will be permanently locked after this step.
                        </label>
                      </div>
                    </div>

                    <div style={{ display: "flex", gap: 10, marginTop: 24 }}>

      const [photoPreview, setPhotoPreview] = useState(null);
      const [searchQ, setSearchQ] = useState("");
      const [viewItem, setViewItem] = useState(null);
      const [photoZoom, setPhotoZoom] = useState(false);

      // Load live listings from DB on mount, merge on top of static list
      React.useEffect(() => {
        fetch(`${API_BASE_URL}/api/marketplace`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              const dbItems = data.map(d => ({
                id: d._id, title: d.title, price: d.price, orig: d.orig || d.price,
                seller: d.sellerName, branch: d.branch, yr: d.year,
                ok: d.verified, cond: d.cond, cat: d.cat,
                photoUrl: d.photoUrl || null,
                sellerPhoto: d.sellerPhoto || null,
                img: d.photoUrl ? <img src={d.photoUrl} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 10 }} alt={d.title} /> : d.cat && d.cat.includes("Books") ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>library_books</span> : d.cat && d.cat.includes("Electronics") ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>build</span> : <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>package</span>,
                desc: d.desc, time: "Recently"
              }));
              setItems([...dbItems, ...LIST]);
            }
          })
          .catch(() => { }); // silently fall back to static LIST
      }, []);

      const handleList = async () => {
        if (!sellForm.title || !sellForm.price) return alert("Please fill all required details!");
        setSellLoading(true);
        const payload = {
          title: sellForm.title,
          price: Number(sellForm.price),
          orig: Number(sellForm.orig || sellForm.price),
          cond: sellForm.cond,
          cat: sellForm.cat,
          desc: sellForm.desc || "No description provided.",
          sellerName: user?.name || "Anonymous",
          sellerRoll: user?.rollNo || "N/A",
          branch: user?.branch || "Unknown",
          year: user?.year || "N/A",
          verified: user?.dbt || false,
          photoData: photoData || null,
        };
        try {
          const res = await fetch(`${API_BASE_URL}/api/marketplace`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            const newItem = {
              id: data.item._id, title: data.item.title, price: data.item.price,
              orig: data.item.orig, seller: data.item.sellerName, branch: data.item.branch,
              yr: data.item.year, ok: data.item.verified, cond: data.item.cond, cat: data.item.cat,
              photoUrl: data.item.photoUrl || null,
              sellerPhoto: data.item.sellerPhoto || user?.profilePhoto || null,
              img: data.item.photoUrl ? <img src={data.item.photoUrl} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 10 }} alt={data.item.title} /> : data.item.cat.includes("Books") ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>library_books</span> : data.item.cat.includes("Electronics") ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>build</span> : <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>package</span>,
              desc: data.item.desc, time: "Just now"
            };
            setItems(prev => [newItem, ...prev]);
            addToast("Listed in Database!", "Your item is live & saved permanently 🎉", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, T.success);
          } else {
            throw new Error(data.error || "Server error");
          }
        } catch (err) {
          // Fallback: add locally even if API fails
          const newItem = {
            id: Date.now(), title: sellForm.title, price: Number(sellForm.price),
            orig: Number(sellForm.orig || sellForm.price), seller: user?.name || "You",
            branch: user?.branch || "Unknown", yr: user?.year || "N/A",
            ok: user?.dbt || false, cond: sellForm.cond, cat: sellForm.cat,
            photoUrl: null,
            sellerPhoto: user?.profilePhoto || null,
            img: sellForm.cat.includes("Books") ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>library_books</span> : sellForm.cat.includes("Electronics") ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>build</span> : <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>package</span>,
            desc: sellForm.desc || "No description.", time: "Just now"
          };
          setItems(prev => [newItem, ...prev]);
          addToast("Listed Locally", "Saved on this device. DB sync failed.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>warning</span>, T.yellow);
        } finally {
          setSellLoading(false);
          setSellOpen(false);
          setSellForm({ title: "", price: "", orig: "", cond: "Good", cat: "Books", desc: "" });
          setPhotoData(null);
          setPhotoPreview(null);
        }
      };

      // Filter by category AND search query
      const searchLower = (search || searchQ).toLowerCase().trim();
      const filtered = items.filter(l => {
        if (cat !== "All" && l.cat !== cat) return false;
        if (searchLower) {
          return (
            (l.title && l.title.toLowerCase().includes(searchLower)) ||
            (l.desc && l.desc.toLowerCase().includes(searchLower)) ||
            (l.cat && l.cat.toLowerCase().includes(searchLower)) ||
            (l.seller && l.seller.toLowerCase().includes(searchLower))
          );
        }
        return true;
      });
      const disc = (o, p) => Math.round((1 - p / o) * 100);

      return (
        <div>
          <div className="screen-hero">
            <div className="screen-hero-inner">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>

                  <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 32, fontWeight: 900, marginTop: 12, lineHeight: 1.15, color: T.text, letterSpacing: '-0.4px' }}>Campus Store</h1>
                  <p style={{ color: T.muted, fontSize: 14, marginTop: 8 }}>{items.length} items from verified students</p>
                </div>
                <Btn variant="primary" style={{ padding: "11px 20px", fontSize: 13, flexShrink: 0 }} onClick={() => setSellOpen(true)}>+ Sell Item</Btn>
              </div>
              <div style={{ marginTop: 16, display: "flex", alignItems: "center", background: "rgba(255,255,255,0.95)", border: `1.5px solid ${searchQ ? 'rgba(255,79,31,0.5)' : T.border}`, borderRadius: 12, padding: "11px 16px", maxWidth: 440, boxShadow: searchQ ? "0 2px 16px rgba(255,79,31,0.10)" : "0 1px 4px rgba(0,0,0,0.04)", transition: "all .25s ease" }}>
                <span className="material-symbols-outlined" style={{ color: searchQ ? T.orange : "#1E3A8A", marginRight: 10, fontSize: 20, transition: "color .2s", fontWeight: 300, display: "flex" }}>search</span>
                <input
                  value={searchQ}
                  onChange={e => setSearchQ(e.target.value)}
                  placeholder="Search books, electronics, tools…"
                  style={{ border: "none", outline: "none", background: "transparent", fontSize: 14, color: T.text, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', width: "100%", fontWeight: 500 }}
                />
                {searchQ && (
                  <button onClick={() => setSearchQ("")} style={{ background: "#F0F0F0", border: "1px solid #E0E0E0", borderRadius: 6, width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 11, color: T.muted, flexShrink: 0, transition: "all .15s" }}>✕</button>
                )}
              </div>
            </div>
          </div>

          <div className="screen-body">
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
              {CATS.map(c => (
                <button key={c} onClick={() => setCat(c)} style={{ background: cat === c ? T.orange : "#fff", color: cat === c ? "#fff" : T.muted, border: `1px solid ${cat === c ? T.orange : T.border}`, boxShadow: cat === c ? "0 2px 10px rgba(255,79,31,0.25)" : "0 1px 3px rgba(0,0,0,0.06)", borderRadius: 20, padding: "7px 16px", fontSize: 12, fontWeight: cat === c ? 700 : 500, cursor: "pointer", transition: "all .15s ease" }}>{c}</button>
              ))}
            </div>

            {searchQ && (
              <div style={{ padding: "10px 16px", borderRadius: 10, background: "rgba(255,79,31,0.04)", border: "1px solid rgba(255,79,31,0.12)", marginTop: 8, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 14 }}>🔎</span>
                <span style={{ fontSize: 13, color: T.text, fontWeight: 600 }}>{filtered.length} result{filtered.length !== 1 ? 's' : ''} for "{searchQ}"</span>
              </div>
            )}

            <div className="grid-auto" style={{ marginTop: 8 }}>
              {filtered.length === 0 ? (
                <div style={{ gridColumn: "1 / -1", textAlign: "center", padding: "60px 20px" }}>
                  <div style={{ fontSize: 48, marginBottom: 12 }}>🔍</div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: T.text }}>No items found</div>
                  <div style={{ fontSize: 13, color: T.muted, marginTop: 6 }}>Try a different search term or category</div>
                </div>
              ) : filtered.map(item => (
                <Card key={item.id} style={{ padding: 0, overflow: "hidden", cursor: "pointer" }} onClick={() => setViewItem(item)}>
                  <div style={{ padding: "16px 18px" }}>
                    <div style={{ display: "flex", gap: 14 }}>
                      <div style={{ width: 60, height: 60, borderRadius: 13, flexShrink: 0, background: "#F5F5F5", border: "1px solid #EBEBEB", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, boxShadow: "inset 0 1px 4px rgba(0,0,0,0.04)", overflow: "hidden" }}>{item.img}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div style={{ fontWeight: 700, fontSize: 14, lineHeight: 1.3, flex: 1, marginRight: 8, color: T.text }}>{item.title}</div>
                          <div style={{ textAlign: "right", flexShrink: 0 }}>
                            <div style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 18, fontWeight: 700, color: T.success }}>₹{item.price}</div>
                            <div style={{ textDecoration: "line-through", color: T.muted, fontSize: 11 }}>₹{item.orig}</div>
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                          <Badge color={T.orange}>-{disc(item.orig, item.price)}% OFF</Badge>
                          <Badge color={item.cond === "Like New" ? T.success : T.yellow}>{item.cond}</Badge>
                          {item.photoUrl && <Badge color={T.indigo}>📷 Has Photo</Badge>}
                        </div>
                      </div>
                    </div>
                    <p style={{ color: T.muted, fontSize: 12, marginTop: 10, lineHeight: 1.5 }}>{item.desc}</p>
                    <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${T.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ width: 30, height: 30, borderRadius: "50%", background: item.sellerPhoto ? "transparent" : "linear-gradient(135deg,rgba(255,79,31,0.20),rgba(255,199,0,0.20))", border: item.sellerPhoto ? "2px solid rgba(255,79,31,0.25)" : "1px solid rgba(255,79,31,0.18)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, overflow: "hidden", flexShrink: 0 }}>{item.sellerPhoto ? <img src={item.sellerPhoto} style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: "50%" }} alt="" /> : '👤'}</div>
                        <div>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <span style={{ fontSize: 12, fontWeight: 700, color: T.text }}>{item.seller}</span>
                            {item.ok && <span style={{ fontSize: 10, color: T.success }}>✓ Verified</span>}
                          </div>
                          <div style={{ color: T.muted, fontSize: 11 }}>{item.branch} • {item.yr} Year • {item.time}</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <Btn onClick={(e) => { e.stopPropagation(); setCon(item); }} variant="teal" style={{ padding: "8px 14px", fontSize: 12 }}>Contact</Btn>
                      </div>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          </div>

          {/* ── ITEM DETAIL / PHOTO VIEWER MODAL ── */}
          <Modal open={!!viewItem} onClose={() => { setViewItem(null); setPhotoZoom(false); }} title={viewItem ? "📦 " + viewItem.title : ""} aboveNav={true}>
            {viewItem && (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                {/* Photo Section */}
                <div
                  onClick={() => viewItem.photoUrl && setPhotoZoom(true)}
                  style={{
                    width: "100%", borderRadius: 16, overflow: "hidden",
                    background: "linear-gradient(145deg,#F8F8F8,#F0F0F0)",
                    border: "1px solid #E8E8E8",
                    minHeight: 200, maxHeight: 320,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    cursor: viewItem.photoUrl ? "zoom-in" : "default",
                    position: "relative",
                    boxShadow: "inset 0 2px 8px rgba(0,0,0,0.04)"
                  }}
                >
                  {viewItem.photoUrl ? (
                    <>
                      <img src={viewItem.photoUrl} alt={viewItem.title} style={{ width: "100%", height: "100%", objectFit: "contain", maxHeight: 320, padding: 8 }} />
                      <div style={{
                        position: "absolute", bottom: 10, right: 10,
                        background: "rgba(0,0,0,0.65)", backdropFilter: "blur(8px)",
                        color: "#fff", borderRadius: 8, padding: "6px 12px",
                        fontSize: 11, fontWeight: 600, display: "flex", alignItems: "center", gap: 5
                      }}>
                        <span style={{ fontSize: 14 }}>🔍</span> Tap to expand
                      </div>
                    </>
                  ) : (
                    <div style={{ textAlign: "center", padding: 40 }}>
                      <div style={{ width: 80, height: 80, margin: "0 auto 12px", borderRadius: 20, background: "#F0F0F0", border: "2px dashed #D0D0D0", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 36 }}>
                        {viewItem.img}
                      </div>
                      <div style={{ fontSize: 13, color: T.muted, fontWeight: 500 }}>No photo uploaded by seller</div>
                      <div style={{ fontSize: 11, color: "#BBB", marginTop: 4 }}>Contact seller to request photos</div>
                    </div>
                  )}
                </div>

                {/* Price & Discount */}
                <div style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "14px 18px", borderRadius: 14,
                  background: "linear-gradient(135deg, rgba(34,197,94,0.06), rgba(34,197,94,0.02))",
                  border: "1px solid rgba(34,197,94,0.18)"
                }}>
                  <div>
                    <div style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 28, fontWeight: 800, color: T.success }}>₹{viewItem.price}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
                      <span style={{ textDecoration: "line-through", color: T.muted, fontSize: 14 }}>₹{viewItem.orig}</span>
                      <Badge color={T.orange}>-{disc(viewItem.orig, viewItem.price)}% OFF</Badge>
                    </div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
                    <Badge color={viewItem.cond === "Like New" ? T.success : T.yellow}>{viewItem.cond}</Badge>
                    <Badge color={T.indigo}>{viewItem.cat}</Badge>
                  </div>
                </div>

                {/* Description */}
                <div style={{ padding: "14px 16px", borderRadius: 12, background: "#FAFAFA", border: `1px solid ${T.border}` }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase", marginBottom: 6, letterSpacing: 0.8 }}>Description</div>
                  <p style={{ fontSize: 14, color: T.text, lineHeight: 1.6 }}>{viewItem.desc}</p>
                </div>

                {/* Seller Info */}
                <div style={{ padding: "14px 16px", borderRadius: 12, background: "linear-gradient(135deg,rgba(255,79,31,0.04),rgba(255,199,0,0.03))", border: "1px solid rgba(255,79,31,0.12)" }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase", marginBottom: 10, letterSpacing: 0.8 }}>Seller</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ width: 48, height: 48, borderRadius: "50%", background: viewItem.sellerPhoto ? "transparent" : "linear-gradient(135deg, #FF4F1F, #FFC700)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: "#fff", fontWeight: 700, flexShrink: 0, border: viewItem.sellerPhoto ? "2.5px solid rgba(255,79,31,0.3)" : "none", boxShadow: "0 2px 10px rgba(255,79,31,0.15)", overflow: "hidden" }}>
                      {viewItem.sellerPhoto ? <img src={viewItem.sellerPhoto} style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: "50%" }} alt="" /> : (viewItem.seller ? viewItem.seller.charAt(0).toUpperCase() : "?")}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ fontSize: 15, fontWeight: 700, color: T.text }}>{viewItem.seller}</span>
                        {viewItem.ok && <span style={{ fontSize: 11, color: T.success, fontWeight: 700, background: "rgba(34,197,94,0.1)", padding: "2px 8px", borderRadius: 10 }}>✓ Verified</span>}
                      </div>
                      <div style={{ color: T.muted, fontSize: 12, marginTop: 2 }}>{viewItem.branch} • {viewItem.yr} Year • {viewItem.time}</div>
                    </div>
                  </div>
                </div>

                {/* Safety Tip */}
                <div style={{ color: T.muted, fontSize: 11, padding: "10px 14px", background: "rgba(255,79,31,0.03)", borderRadius: 10, border: "1px solid rgba(255,79,31,0.10)", lineHeight: 1.5, textAlign: "center" }}>
                  💡 Meet in a public campus location for transactions. Never share bank OTPs.
                </div>

                {/* Action Buttons */}
                <div style={{ display: "flex", gap: 10 }}>
                  <Btn variant="teal" style={{ flex: 1, padding: 14 }} onClick={() => {
                    setViewItem(null);
                    setCon(viewItem);
                  }}>📞 Contact Seller</Btn>
                  {viewItem.photoUrl && (
                    <Btn variant="ghost" style={{ padding: "14px 18px" }} onClick={() => setPhotoZoom(true)}>🖼️ View Photo</Btn>
                  )}
                </div>
              </div>
            )}
          </Modal>

          {/* ── FULLSCREEN PHOTO ZOOM OVERLAY ── */}
          {photoZoom && viewItem && viewItem.photoUrl && (
            <div onClick={() => setPhotoZoom(false)} style={{
              position: "fixed", inset: 0, zIndex: 99999,
              background: "rgba(0,0,0,0.92)", backdropFilter: "blur(20px)",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              animation: "fadeUp 0.3s cubic-bezier(0.16,1,0.3,1) both",
              cursor: "zoom-out"
            }}>
              <div style={{ position: "absolute", top: 16, right: 16, display: "flex", gap: 10, zIndex: 10 }}>
                <button onClick={() => setPhotoZoom(false)} style={{
                  background: "rgba(255,255,255,0.15)", border: "1px solid rgba(255,255,255,0.2)",
                  color: "#fff", borderRadius: 10, width: 40, height: 40, cursor: "pointer",
                  fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center",
                  backdropFilter: "blur(10px)", transition: "all .15s"
                }}>✕</button>
              </div>
              <div style={{ position: "absolute", top: 16, left: 16, zIndex: 10 }}>
                <div style={{ background: "rgba(255,255,255,0.12)", backdropFilter: "blur(10px)", borderRadius: 10, padding: "8px 16px", border: "1px solid rgba(255,255,255,0.15)" }}>
                  <div style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>{viewItem.title}</div>
                  <div style={{ color: "rgba(255,255,255,0.6)", fontSize: 12 }}>{viewItem.seller} • ₹{viewItem.price}</div>
                </div>
              </div>
              <img
                onClick={e => e.stopPropagation()}
                src={viewItem.photoUrl}
                alt={viewItem.title}
                style={{
                  maxWidth: "90vw", maxHeight: "80vh",
                  objectFit: "contain", borderRadius: 12,
                  boxShadow: "0 20px 80px rgba(0,0,0,0.5)",
                  cursor: "default"
                }}
              />
              <div style={{
                marginTop: 16, color: "rgba(255,255,255,0.5)", fontSize: 12, fontWeight: 500,
                display: "flex", alignItems: "center", gap: 6
              }}>
                <span>📷</span> Tap outside or press ✕ to close
              </div>
            </div>
          )}

          <Modal open={!!con} onClose={() => setCon(null)} title="📞 Contact Seller" aboveNav={true}>
            {con && (
              <>
                <div style={{ padding: "14px 16px", borderRadius: 12, background: "linear-gradient(135deg,rgba(255,79,31,0.06),rgba(255,199,0,0.04))", border: "1px solid rgba(255,79,31,0.14)", marginBottom: 20 }}>
                  <div style={{ fontWeight: 700, marginBottom: 4, color: T.text }}>{con.title}</div>
                  <div style={{ color: T.success, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 20, fontWeight: 700 }}>₹{con.price}</div>
                </div>
                {[[<span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>person</span>, "Seller", con.seller], [<span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>school</span>, "Branch", con.branch + " • " + con.yr + " Year"], [<span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>timer</span>, "Listed", con.time]].map(([icon, label, val]) => (
                  <div key={label} style={{ display: "flex", gap: 10, padding: "10px 14px", borderRadius: 10, background: "#F8F8F8", border: "1px solid #EBEBEB", marginBottom: 8 }}>
                    <span style={{ fontSize: 16 }}>{icon}</span>
                    <div><div style={{ color: T.muted, fontSize: 11 }}>{label}</div><div style={{ fontWeight: 600, fontSize: 13, color: T.text }}>{val}</div></div>
                  </div>
                ))}
                <div style={{ color: T.muted, fontSize: 11, marginTop: 10, padding: "10px 14px", background: "rgba(255,79,31,0.04)", borderRadius: 10, border: "1px solid rgba(255,79,31,0.14)", lineHeight: 1.5 }}>💡 Meet in a public campus location. Never share bank OTPs.</div>
                <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
                  <Btn variant="teal" style={{ flex: 1 }} onClick={() => {
                    addToast("Opening WhatsApp", "Connecting you with " + con.seller, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>chat</span>, T.teal);

                    {CATS.slice(1).map(c => <option key={c} value={c}>{c}</option>)}

                <div>

                  <select value={sellForm.cond} onChange={e => setSellForm(p => ({ ...p, cond: e.target.value }))} style={{ width: "100%", padding: "10px 14px", marginTop: 4, borderRadius: 8, border: "1px solid #EBEBEB", background: T.gray, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }}>
                    <option>Like New</option><option>Good</option><option>Used</option><option>Digital</option>

              <div className="grid-2">
                <div>
                  <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Your Price (₹)</label>
                  <input type="number" value={sellForm.price} onChange={e => setSellForm(p => ({ ...p, price: e.target.value }))} style={{ width: "100%", padding: "10px 14px", marginTop: 4, borderRadius: 8, border: "1px solid #EBEBEB", background: T.gray, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }} placeholder="₹0" />
                </div>
                <div>
                  <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Original MRP (₹)</label>
                  <input type="number" value={sellForm.orig} onChange={e => setSellForm(p => ({ ...p, orig: e.target.value }))} style={{ width: "100%", padding: "10px 14px", marginTop: 4, borderRadius: 8, border: "1px solid #EBEBEB", background: T.gray, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }} placeholder="Optional" />
                </div>
              </div>

              <div>
                <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Description</label>
                <textarea rows="2" value={sellForm.desc} onChange={e => setSellForm(p => ({ ...p, desc: e.target.value }))} style={{ width: "100%", padding: "10px 14px", marginTop: 4, borderRadius: 8, border: "1px solid #EBEBEB", background: T.gray, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', resize: "none" }} placeholder="Any defects or special notes?" />
              </div>

              <label style={{ display: "block", padding: photoPreview ? "8px" : "16px", borderRadius: 12, border: photoPreview ? `2px solid ${T.success}44` : "2px dashed #C0C0C0", background: photoPreview ? "#F0FFF4" : "#FAFAFA", textAlign: "center", cursor: "pointer", marginTop: 6, transition: "all .2s ease", position: "relative" }}>
                <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={(e) => {
                  if (e.target.files && e.target.files.length > 0) {
                    const file = e.target.files[0];
                    if (file.size > 5 * 1024 * 1024) {
                      addToast("File Too Large", "Please select an image under 5MB", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>error</span>, T.rose);
                      return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                      setPhotoData(reader.result);
                      setPhotoPreview(reader.result);
                      addToast("Photo Attached ✓", file.name, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>photo_camera</span>, T.success);
                    };
                    reader.readAsDataURL(file);
                  }
                }} />
                {photoPreview ? (
                  <div style={{ position: "relative" }}>
                    <img src={photoPreview} style={{ width: "100%", maxHeight: 180, objectFit: "contain", borderRadius: 8 }} alt="Preview" />
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginTop: 8, padding: "6px 0" }}>

                    </div>

                ) : (

                    <div style={{ fontSize: 28, marginBottom: 6 }}>📸</div>

              <Btn variant="primary" style={{ width: "100%", padding: 14, fontSize: 15, marginTop: 8 }} disabled={sellLoading} onClick={handleList}>{sellLoading ? (photoData ? "⏳ Uploading Photo & Saving…" : "⏳ Saving to Database…") : "🚀 List Item for Sale"}</Btn>

    /* ══════════════════════════════════════
      MODULE: COMMUNITY FORUM
    ══════════════════════════════════════ */
    function CommunityForum({ search = "" }) {
      const { user } = useUser();
      const [posts, setPosts] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [postOpen, setPostOpen] = React.useState(false);
      const [viewPost, setViewPost] = React.useState(null);
      const [commentText, setCommentText] = React.useState("");
      const [postForm, setPostForm] = React.useState({ title: "", content: "", category: "Doubt" });
      const [photoData, setPhotoData] = React.useState(null);
      const [photoPreview, setPhotoPreview] = React.useState(null);
      const [posting, setPosting] = React.useState(false);
      const addToast = useToast();

      const fetchPosts = () => {
        setLoading(true);
        fetch(`${API_BASE_URL}/api/community`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data)) setPosts(data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      React.useEffect(() => {
        fetchPosts();
      }, []);

      const handleCreatePost = async () => {
        if (!postForm.title || !postForm.content) {
          addToast("Missing Fields", "Please add a title and description.", <span className="material-symbols-outlined">error</span>, T.rose);
          return;
        }
        setPosting(true);
        const payload = {
          ...postForm,
          authorName: user.name,
          authorRoll: user.rollNo,
          authorPhoto: user.profilePhoto,
          photoData
        };

        try {
          const res = await fetch(`${API_BASE_URL}/api/community`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            setPosts(prev => [data, ...prev]);
            setPostOpen(false);
            setPostForm({ title: "", content: "", category: "Doubt" });
            setPhotoData(null);
            setPhotoPreview(null);
            addToast("Post shared!", "Your doubt is now live.", <span className="material-symbols-outlined">check_circle</span>, T.success);
          } else {
            throw new Error(data.error || "Post failed");
          }
        } catch (err) {
          addToast("Post failed", err.message, <span className="material-symbols-outlined">error</span>, T.rose);
        } finally {
          setPosting(false);
        }
      };

      const handleAddComment = async () => {
        if (!commentText.trim()) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/community/${viewPost._id}/comment`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              authorName: user.name,
              authorRoll: user.rollNo,
              authorPhoto: user.profilePhoto,
              text: commentText
            })
          });
          const updatedPost = await res.json();
          if (res.ok) {
            setViewPost(updatedPost);
            setPosts(prev => prev.map(p => p._id === updatedPost._id ? updatedPost : p));
            setCommentText("");
            addToast("Comment added", "Thanks for helping!", <span className="material-symbols-outlined">chat</span>, T.indigo);
          }
        } catch (err) { }
      };

      // Apply Global Search Filter
      const searchLower = search.toLowerCase().trim();
      const filteredPosts = posts.filter(p => {
        if (!searchLower) return true;
        return (
          (p.title && p.title.toLowerCase().includes(searchLower)) ||
          (p.content && p.content.toLowerCase().includes(searchLower)) ||
          (p.category && p.category.toLowerCase().includes(searchLower))
        );
      });

      return (
        <div>
          <div className="screen-hero">
            <div className="screen-hero-inner" style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
              <div>

                <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 32, fontWeight: 900, marginTop: 12, color: T.text, letterSpacing: '-0.4px' }}>Community Hub</h1>
                <p style={{ color: T.muted, fontSize: 14, marginTop: 8 }}>Resolve doubts and share knowledge with fellow students</p>
              </div>
              <Btn variant="primary" style={{ padding: "12px 24px", flexShrink: 0 }} onClick={() => setPostOpen(true)}>+ Ask Doubt</Btn>
            </div>
          </div>

          <div className="screen-body">
            {loading ? (
              <div style={{ textAlign: "center", padding: "40px", color: T.muted }}>⏳ Loading discussions...</div>
            ) : filteredPosts.length === 0 ? (
              <div style={{ textAlign: "center", padding: "80px 20px", background: "#fff", borderRadius: 20, border: `1px solid ${T.border}` }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>💬</div>
                <div style={{ fontWeight: 700, fontSize: 18, color: T.text }}>{search ? "No matches found" : "No discussions yet"}</div>
                <p style={{ color: T.muted, marginTop: 6 }}>{search ? "Try a different search term" : "Be the first to ask a doubt or share an update!"}</p>
                {!search && <Btn variant="primary" style={{ marginTop: 20 }} onClick={() => setPostOpen(true)}>Start a Discussion</Btn>}
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                {filteredPosts.map(post => (
                  <Card key={post._id} onClick={() => setViewPost(post)} style={{ cursor: "pointer", transition: "transform 0.2s" }}>
                    <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 12 }}>
                      <div style={{ width: 36, height: 36, borderRadius: "50%", background: post.authorPhoto ? "transparent" : `linear-gradient(135deg, ${T.orange}, ${T.yellow})`, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", border: post.authorPhoto ? `1px solid ${T.border}` : "none" }}>
                        {post.authorPhoto ? <img src={post.authorPhoto} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "#fff", fontWeight: 700, fontSize: 14 }}>{post.authorName[0]}</span>}
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 14, color: T.text }}>{post.authorName}</div>
                        <div style={{ fontSize: 11, color: T.muted }}>{new Date(post.createdAt).toLocaleDateString()} • {post.authorRoll}</div>
                      </div>
                      <Badge color={post.category === "Doubt" ? T.rose : T.teal}>{post.category}</Badge>
                    </div>
                    <div style={{ fontWeight: 800, fontSize: 17, color: T.text, marginBottom: 8, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }}>{post.title}</div>
                    <p style={{ fontSize: 14, color: "#555", lineHeight: 1.5, display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{post.content}</p>

                    {post.photoUrl && (
                      <div style={{ marginTop: 12, borderRadius: 12, overflow: "hidden", maxHeight: 200, border: `1px solid ${T.border}` }}>
                        <img src={post.photoUrl} style={{ width: "100%", objectFit: "cover" }} />
                      </div>
                    )}

                    <div style={{ display: "flex", gap: 16, marginTop: 14, paddingTop: 14, borderTop: `1px solid ${T.border}`, color: T.muted, fontSize: 12, fontWeight: 700 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>💬 {post.comments.length} Comments</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: "auto", color: T.orange }}>View Thread →</div>
                    </div>
                  </Card>
                ))}
              </div>
            )}
          </div>

          {/* Post Detail Modal */}
          <Modal open={!!viewPost} onClose={() => setViewPost(null)} title="Discussion Thread" aboveNav={true}>
            {viewPost && (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                  <div style={{ width: 44, height: 44, borderRadius: "12px", background: viewPost.authorPhoto ? "transparent" : `linear-gradient(135deg, ${T.orange}, ${T.yellow})`, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", border: viewPost.authorPhoto ? `1px solid ${T.border}` : "none" }}>
                    {viewPost.authorPhoto ? <img src={viewPost.authorPhoto} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "#fff", fontWeight: 700 }}>{viewPost.authorName[0]}</span>}
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15 }}>{viewPost.authorName}</div>
                    <div style={{ fontSize: 12, color: T.muted }}>{viewPost.authorRoll} • {new Date(viewPost.createdAt).toLocaleString()}</div>
                  </div>
                </div>

                <div style={{ fontWeight: 800, fontSize: 20, color: T.text, marginTop: 4, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }}>{viewPost.title}</div>
                <p style={{ fontSize: 15, color: "#444", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{viewPost.content}</p>

                {viewPost.photoUrl && (
                  <div style={{ borderRadius: 16, overflow: "hidden", border: `1px solid ${T.border}`, background: "#F5F5F5" }}>
                    <img src={viewPost.photoUrl} style={{ width: "100%", maxHeight: 400, objectFit: "contain", display: "block" }} />
                  </div>
                )}

                <div style={{ marginTop: 8, paddingTop: 16, borderTop: `1px solid ${T.border}` }}>
                  <div style={{ fontWeight: 800, fontSize: 12, marginBottom: 16, color: T.muted, textTransform: "uppercase", letterSpacing: 0.5 }}>Comments Support ({viewPost.comments.length})</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {viewPost.comments.length === 0 ? (
                      <div style={{ textAlign: "center", padding: "20px 0", color: T.muted, fontSize: 13, fontStyle: "italic" }}>No replies yet. Be the first to help!</div>
                    ) : viewPost.comments.map((c, i) => (
                      <div key={i} style={{ padding: "14px 16px", background: "#F8F9FA", borderRadius: 12, border: `1px solid ${T.border}` }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <div style={{ width: 28, height: 28, borderRadius: "8px", background: c.authorPhoto ? "transparent" : T.indigo, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>
                            {c.authorPhoto ? <img src={c.authorPhoto} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "#fff", fontWeight: 700 }}>{c.authorName[0]}</span>}
                          </div>
                          <div style={{ fontWeight: 700, fontSize: 13, color: T.text }}>{c.authorName}</div>
                          <div style={{ fontSize: 11, color: T.muted, marginLeft: "auto" }}>{new Date(c.createdAt).toLocaleDateString()}</div>
                        </div>
                        <div style={{ fontSize: 14, color: "#333", lineHeight: 1.5 }}>{c.text}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ display: "flex", gap: 10, marginTop: 12, alignItems: "center", padding: "8px", background: "#fff", border: `1px solid ${T.border}`, borderRadius: 14, position: "sticky", bottom: 0 }}>
                  <input
                    value={commentText}
                    onChange={e => setCommentText(e.target.value)}
                    placeholder="Provide a solution or helpful tip..."
                    style={{ flex: 1, padding: "10px 14px", border: "none", outline: "none", fontSize: 14, background: "transparent" }}
                    onKeyPress={e => e.key === 'Enter' && handleAddComment()}
                  />
                  <Btn variant="primary" style={{ padding: "10px 18px", borderRadius: 10 }} onClick={handleAddComment}>Reply</Btn>
                </div>
              </div>
            )}
          </Modal>

          {/* Create Post Modal */}
          <Modal open={postOpen} onClose={() => setPostOpen(false)} title="📝 Start a Discussion" aboveNav={true}>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div>
                <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Post Category</label>
                <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                  {["Doubt", "Note", "Update", "General"].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setPostForm(p => ({ ...p, category: cat }))}
                      style={{
                        flex: 1, padding: "8px", borderRadius: 10, fontSize: 12, fontWeight: 700,
                        border: `1.5px solid ${postForm.category === cat ? T.orange : T.border}`,
                        background: postForm.category === cat ? `${T.orange}10` : "#fff",
                        color: postForm.category === cat ? T.orange : T.muted,
                        transition: "all 0.2s"
                      }}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Heading</label>
                <input value={postForm.title} onChange={e => setPostForm(p => ({ ...p, title: e.target.value }))} style={{ width: "100%", padding: "12px 14px", marginTop: 6, borderRadius: 10, border: `1px solid ${T.border}`, background: T.gray, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }} placeholder="e.g., Struggling with Fourier Series..." />
              </div>

              <div>
                <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Content / Doubt Details</label>
                <textarea rows="5" value={postForm.content} onChange={e => setPostForm(p => ({ ...p, content: e.target.value }))} style={{ width: "100%", padding: "12px 14px", marginTop: 6, borderRadius: 10, border: `1px solid ${T.border}`, background: T.gray, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', resize: "none", fontSize: 14 }} placeholder="Explain your query clearly so others can help you better..." />
              </div>

              <div>
                <label style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: "uppercase" }}>Attach Image (Optional)</label>
                <label style={{ display: "block", padding: photoPreview ? "10px" : "20px", borderRadius: 12, border: `2px dashed ${photoPreview ? T.success : "#C0C0C0"}`, background: photoPreview ? `${T.success}05` : "#FAFAFA", textAlign: "center", cursor: "pointer", marginTop: 6, transition: "all .2s ease" }}>
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => {
                    if (e.target.files && e.target.files[0]) {
                      const file = e.target.files[0];
                      if (file.size > 5 * 1024 * 1024) {
                        addToast("Too Large", "Max 5MB allowed", <span className="material-symbols-outlined">error</span>, T.rose);
                        return;
                      }
                      const reader = new FileReader();
                      reader.onloadend = () => {
                        setPhotoData(reader.result);
                        setPhotoPreview(reader.result);
                      };
                      reader.readAsDataURL(file);
                    }
                  }} />
                  {photoPreview ? (
                    <div style={{ position: "relative" }}>
                      <img src={photoPreview} style={{ width: "100%", maxHeight: 180, objectFit: "contain", borderRadius: 8 }} />
                      <div style={{ position: "absolute", top: 5, right: 5, background: "rgba(0,0,0,0.5)", color: "#fff", borderRadius: "50%", width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }} onClick={(e) => { e.preventDefault(); setPhotoData(null); setPhotoPreview(null); }}>✕</div>
                    </div>

            response = "For DBT or Bank Linking issues, you must visit your home bank branch with your Aadhaar and passbook. Request them to perform 'Aadhaar Seeding for DBT'. It usually takes 48 hours to reflect on the NPCI mapper.";
          } else if (lower.includes("suspect") || lower.includes("mismatch") || lower.includes("marks") || lower.includes("enrollment")) {
