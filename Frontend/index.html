    /* ══════════════════════════════════════
      INSTITUTE ADMIN DASHBOARD (Verification Hub)
    ══════════════════════════════════════ */
    function InstituteAdminDashboard({ onLogout }) {
      const [applications, setApplications] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedApp, setSelectedApp] = useState(null);
      const [remark, setRemark] = useState("");
      const addToast = useToast();

      const openDoc = (data) => {
        if (!data || !data.startsWith('data:')) {
          if (data) window.open(data, '_blank');
          return;
        }
        try {
          const parts = data.split(',');
          const contentType = parts[0].split(':')[1].split(';')[0];
          const byteCharacters = atob(parts[1]);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: contentType });
          const url = URL.createObjectURL(blob);
          window.open(url, '_blank');
        } catch (e) {
          window.open(data, '_blank');
        }
      };

      const fetchApplications = async () => {
        try {
          setLoading(true);
          const res = await fetch(`${API_BASE_URL}/api/users/institute-applications`);
          if (res.ok) {
            setApplications(await res.json());
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchApplications();
      }, []);

      const handleVerify = async (status) => {
        if (status === 'Rejected_by_Institute' && !remark.trim()) {
          return addToast("Remark Required", "Please provide a reason for rejection.", "⚠️", T.rose);

          const res = await fetch(`${API_BASE_URL}/api/users/verify-application`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ applicationId: selectedApp._id, status, remark })
          });

            addToast("Success", `Application ${status === 'Verified_by_Institute' ? 'Verified' : 'Rejected'}`, "✅", T.success);
            setSelectedApp(null);
            setRemark("");
            fetchApplications();

            {!selectedApp ? (

                {/* RIGHT SIDE: SCHOLARSHIP FORM */}
                <Card style={{ background: "#FFF", border: "1px solid #E5E7EB" }}>
                  <div style={{ borderBottom: "1px solid #E5E7EB", paddingBottom: 12, marginBottom: 16 }}>

                      <div style={{ fontWeight: 600 }}>{selectedApp.studentReference?.jeeRoll || "N/A"} (Rank: {selectedApp.studentReference?.jeeRank || "N/A"})</div>
                    </div>
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ fontSize: 11, color: T.muted, textTransform: "uppercase", fontWeight: 700 }}>Non-Refundable Fee</div>
                      <div style={{ fontWeight: 600, color: T.success }}>₹{selectedApp.nonRefundableFeeAmount || "0"}</div>

                  {/* PAST EDUCATION & CERTS */}
                  <div style={{ marginTop: 16, borderTop: "1px solid #E5E7EB", paddingTop: 16 }}>
                    <div className="grid-2">
                      <div style={{ marginBottom: 12 }}>
                        <div style={{ fontSize: 11, color: T.indigo, textTransform: "uppercase", fontWeight: 700 }}>10th Details</div>
                        <div style={{ fontSize: 13, marginTop: 4 }}>
                          <b>Board:</b> {selectedApp.highSchool?.board || "N/A"}<br />

    /* ══════════════════════════════════════
          APP WITH PROVIDERS
        ══════════════════════════════════════ */
    function AppWithProviders() {
      const [splashDone, setSplashDone] = useState(false);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [user, setUser] = useState(() => {
        // Initialise user state — real hydration happens in useEffect below
        return {
          name: "Dev Kumar",
          initials: "DK",
          branch: "CSE",
          year: "1st",
          dbt: false,
          scholarshipStage: 1,
          rollNo: "250164152002",
          email: "",
          University: "AKTU — Lucknow",
          valid: "May 2026",
        };
      });
      const [toasts, setToasts] = useState([]);

      const addToast = (title, sub = "", icon = <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, accent = T.orange) => {
        const id = Date.now() + Math.random();
        setToasts(p => [...p, { id, title, sub, icon, accent }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3600);
      };

      const saveToStorage = (data) => {
        try {
          const lean = { ...data };
          // Remove heavy Base64 strings before saving to localStorage
          const heavyFields = ['aadhaarDocument', 'class10Document', 'class12Document', 'incomeDocument', 'feeReceiptDocument', 'profilePhoto'];
          heavyFields.forEach(f => delete lean[f]);
          localStorage.setItem("studentData", JSON.stringify(lean));
        } catch (e) {
          console.error("Storage error:", e);
          localStorage.clear(); // Emergency clear if quota exceeded
        }
      };

      const updateUser = patch => setUser(p => {
        const updated = { ...p, ...patch };
        saveToStorage(updated);
        return updated;
      });

      const refreshUser = async () => {
        if (!user.rollNo) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/users/search/${user.rollNo}`);
          if (res.ok) {
            const freshData = await res.json();
            const updated = { ...user, ...freshData };
            setUser(updated);
            saveToStorage(updated);
          }
        } catch (e) { console.error("Sync failed", e); }
      };

      // ── PERSISTENCE: Auto-login if localStorage has studentData ──
      useEffect(() => {
        try {
          const raw = localStorage.getItem("studentData");
          if (raw) {
            const storedData = JSON.parse(raw);
            if (storedData && (storedData.rollNo || storedData.email)) {
              const storedName = storedData.name || localStorage.getItem("studentName") || "Dev Kumar";
              const inits = storedName.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

              setUser({
                ...storedData,
                name: storedName,
                initials: inits,
                branch: storedData.branch || "CSE",
                year: storedData.year || "1st Year",
                dbt: storedData.dbt || false,
                scholarshipStage: storedData.scholarshipStage || 1,
                University: "AKTU — Lucknow",
                valid: "May 2026",
              });

              setIsLoggedIn(true);

              // ── Admin Recognition on Refresh ──
              if ((storedData.email || "").toLowerCase() === 'vidyasetu@aktu.ac.in' || storedData.isAdmin === true) {
                setIsAdmin(true);
              } else {
                setIsAdmin(false);
              }

            }
          }
        } catch (e) {
          localStorage.clear();
        }
      }, []);




      // ── AUTO LOGOUT (5 mins inactivity) ──
      useEffect(() => {
        if (!isLoggedIn) return;
        let timeout;
        const resetTimer = () => {
          clearTimeout(timeout);
          timeout = setTimeout(() => {
            alert("Session expired due to 5 minutes of inactivity.");
            handleLogout();
          }, 15 * 60 * 1000); // 5 minutes
        };

        const events = ['mousemove', 'mousedown', 'keypress', 'scroll', 'touchstart'];
        events.forEach(e => window.addEventListener(e, resetTimer));
        resetTimer();

        return () => {
          clearTimeout(timeout);
          events.forEach(e => window.removeEventListener(e, resetTimer));
        };
      }, [isLoggedIn]);

      // ── LOGOUT: clear storage and force full page reload ──
      const handleLogout = () => {
        localStorage.clear();
        window.location.href = '/'; // Forces browser to forget session state
      };

      if (!splashDone) return <SplashScreen onDone={() => setSplashDone(true)} />;

      if (!isLoggedIn) return <Login onLogin={(fetchedData) => {
        setIsLoggedIn(true);
        if (fetchedData) {
          const inits = (fetchedData.name || "DK").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
          const isAdminUser = (fetchedData.email || "").toLowerCase() === 'vidyasetu@aktu.ac.in';

          const finalUser = {
            ...fetchedData,
            initials: inits,
            isAdmin: isAdminUser
          };

          setUser(finalUser);
          setIsAdmin(isAdminUser);

          // Persist lean version to localStorage
          saveToStorage(finalUser);
          if (finalUser.name) localStorage.setItem("studentName", finalUser.name);
        }
      }} />;



      if (isAdmin) {
        return (
          <ToastContext.Provider value={addToast}>
            <AdminDashboard onLogout={handleLogout} />
            <ToastSystem toasts={toasts} />
          </ToastContext.Provider>
        );
      }

      return (
        <UserContext.Provider value={{ user, updateUser, refreshUser }}>
          <ToastContext.Provider value={addToast}>
            <App onLogout={handleLogout} />
            <ToastSystem toasts={toasts} />
          </ToastContext.Provider>
        </UserContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppWithProviders />);
