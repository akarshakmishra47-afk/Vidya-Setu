                    style={{ flex: 2, background: `linear-gradient(135deg,${T.indigo},#6366F1)`, color: "#fff", border: "none", borderRadius: 12, padding: "12px", fontSize: 13, fontWeight: 700, cursor: "pointer", textDecoration: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, boxShadow: "0 4px 16px rgba(79,70,229,0.30)", textAlign: "center" }}>
                    <span className="material-symbols-outlined" style={{ fontSize: 18 }}>open_in_new</span>
                    Apply on Official Portal ↗
                  </a>
                </div>
              </>
            )}
          </Modal>

          {/* APPLICATION MODAL */}
          {applyingFor && (
            <Modal title="Complete Application" onClose={() => { setApplyingFor(null); setUploadedDoc({}); }}>
              <div style={{ padding: 16, background: "#FFFBF0", border: "1px solid #FDE68A", borderRadius: 12, marginBottom: 16 }}>
                <div style={{ fontWeight: 700, color: "#D97706", fontSize: 14 }}>⚠️ Government Rule</div>
                <div style={{ color: "#92400E", fontSize: 12, marginTop: 4 }}>You may only hold ONE active government scholarship at a time. Trying to apply for a second will result in an automatic rejection.</div>
              </div>

              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>Required Documents <span style={{ color: T.muted, fontWeight: 400, fontSize: 12 }}>(Simulated)</span></div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
                {applyingFor.documentsRequired.map(doc => (
                  <div key={doc} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: `1px solid ${T.border}`, padding: "12px 16px", borderRadius: 10 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{doc}</div>
                    <div style={{ position: "relative" }}>
                      <input
                        type="file"
                        id={`hub-upload-${doc}`}
                        style={{ display: "none" }}
                        onChange={(e) => handleFileUpload(doc, e.target.files[0])}
                      />
                      <label
                        htmlFor={`hub-upload-${doc}`}
                        style={{
                          background: uploadedDoc[doc] ? T.success + "15" : T.teal + "15",
                          color: uploadedDoc[doc] ? T.success : T.teal,
                          padding: "8px 14px",
                          borderRadius: 8,
                          fontSize: 12,
                          fontWeight: 700,
                          cursor: uploadedDoc[doc] ? "default" : "pointer",
                          display: "flex",
                          alignItems: "center",
                          gap: 6
                        }}
                      >
                        {uploadedDoc[doc] ? <><span className="material-symbols-outlined" style={{ fontSize: 16 }}>check_circle</span> Attached</> : <><span className="material-symbols-outlined" style={{ fontSize: 16 }}>upload</span> Attach File</>}
                      </label>
                    </div>
                  </div>
                ))}
              </div>

              <button onClick={handleApply} disabled={applyingFor.documentsRequired.length !== Object.keys(uploadedDoc).length} style={{ background: applyingFor.documentsRequired.length !== Object.keys(uploadedDoc).length ? T.border : `linear-gradient(135deg,${T.success},#10B981)`, color: applyingFor.documentsRequired.length !== Object.keys(uploadedDoc).length ? T.muted : "#fff", border: "none", borderRadius: 12, padding: "14px", fontSize: 14, fontWeight: 800, cursor: applyingFor.documentsRequired.length !== Object.keys(uploadedDoc).length ? "not-allowed" : "pointer", width: "100%", transition: "all .2s ease" }}>
                Submit Final Application
              </button>
            </Modal>
          )}
          {/* VIDYA AI MODAL */}
          <Modal open={showAI} onClose={() => setShowAI(false)} title="🤖 Chat with Vidya AI" aboveNav={true}>
            <div style={{ display: "flex", flexDirection: "column", height: "400px" }}>
              <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 12, padding: "10px" }}>
                {aiMessages.map((m, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: m.sender === "user" ? "flex-end" : "flex-start" }}>
                    <div style={{ maxWidth: "80%", padding: "12px 16px", borderRadius: 16, borderBottomRightRadius: m.sender === "user" ? 4 : 16, borderBottomLeftRadius: m.sender === "ai" ? 4 : 16, background: m.sender === "user" ? `linear-gradient(135deg,${T.indigo},#4338ca)` : "#F3F4F6", color: m.sender === "user" ? "#fff" : T.text, fontSize: 13, lineHeight: 1.5, boxShadow: m.sender === "user" ? "0 4px 12px rgba(67,56,202,0.2)" : "none" }}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {aiLoading && (
                  <div style={{ display: "flex", justifyContent: "flex-start" }}>
                    <div style={{ padding: "12px 16px", borderRadius: 16, borderBottomLeftRadius: 4, background: "#F3F4F6", color: T.muted, fontSize: 13 }}>
                      <span className="material-symbols-outlined" style={{ fontSize: 16, animation: "spin 1s linear infinite", verticalAlign: "middle" }}>sync</span> Thinking...
                    </div>
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 10, padding: "10px 0 0", borderTop: `1px solid ${T.border}` }}>
                <input
                  type="text"
                  value={aiInput}
                  onChange={e => setAiInput(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleAiSubmit()}
                  placeholder="Type your scholarship problem here..."
                  style={{ flex: 1, padding: "12px 16px", background: "#F9FAFB", color: T.text, border: `1px solid ${T.border}`, borderRadius: 24, fontSize: 13, outline: "none" }}
                />
                <button onClick={handleAiSubmit} style={{ width: 42, height: 42, borderRadius: "50%", background: T.indigo, color: "#fff", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 20 }}>send</span>
                </button>
              </div>
            </div>
          </Modal>

          {/* REPORT PROBLEM MODAL */}
          <Modal open={showReportForm} onClose={() => setShowReportForm(false)} title="Report New Scholarship Problem" aboveNav={true}>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div>
                <label style={{ fontSize: 12, fontWeight: 700, color: T.muted, marginBottom: 4, display: "block" }}>Problem Title</label>
                <input type="text" value={newProblem.title} onChange={e => setNewProblem({ ...newProblem, title: e.target.value })} placeholder="e.g. Blank Screen on Step 2" style={{ width: "100%", padding: "12px 14px", background: "#F9FAFB", color: T.text, border: `1px solid ${T.border}`, borderRadius: 10, fontSize: 14 }} />
              </div>
              <div>
                <label style={{ fontSize: 12, fontWeight: 700, color: T.muted, marginBottom: 4, display: "block" }}>Description</label>
                <textarea value={newProblem.desc} onChange={e => setNewProblem({ ...newProblem, desc: e.target.value })} placeholder="Explain what went wrong..." rows="3" style={{ width: "100%", padding: "12px 14px", background: "#F9FAFB", color: T.text, border: `1px solid ${T.border}`, borderRadius: 10, fontSize: 14, resize: "vertical" }} />
              </div>
              <button onClick={() => {
                if (!newProblem.title) return addToast("Error", "Please enter a title", <span className="material-symbols-outlined" style={{ fontSize: 18 }}>warning</span>, T.rose);
                setCustomProblems([...customProblems, {
                  id: Date.now().toString(),
                  title: newProblem.title,
                  desc: newProblem.desc || "Awaiting further details.",
                  icon: "help_outline",
                  steps: [
                    ["1", "Issue Logged", "Your problem has been securely reported to our administrators."],
                    ["2", "Under Investigation", "The Vidya Setu team is researching a step-by-step fix."],
                    ["3", "Check Back Soon", "A verified guide will be published here shortly."]
                  ]
                }]);
                setShowReportForm(false);
                setNewProblem({ title: "", desc: "" });
                addToast("Problem Reported!", "We will add a guide for this soon.", <span className="material-symbols-outlined" style={{ fontSize: 18 }}>check_circle</span>, T.success);
              }} style={{ background: `linear-gradient(135deg,${T.indigo},#6366F1)`, color: "#fff", border: "none", borderRadius: 12, padding: "12px", fontSize: 13, fontWeight: 800, cursor: "pointer", marginTop: 8, transition: "all .2s ease" }}>
                Submit Problem
              </button>
            </div>
          </Modal>

          {/* ACTIVE GUIDE MODAL */}
          <Modal open={!!activeGuide} onClose={() => setActiveGuide(null)} title={activeGuide ? `🛠️ ${activeGuide.title} Guide` : ""} aboveNav={true}>
            {activeGuide && (
              <>
                <div style={{ background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.18)", borderRadius: 14, padding: "14px 18px", marginBottom: 20, display: "flex", alignItems: "center", gap: 12 }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 24, color: T.rose }}>{activeGuide.icon}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 800, fontSize: 14, color: T.text }}>{activeGuide.title}</div>
                    <div style={{ fontSize: 12, color: T.muted, marginTop: 2 }}>{activeGuide.desc}</div>
                  </div>
                </div>
                <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 14, color: T.text, display: "flex", alignItems: "center", gap: 8 }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 18, color: T.indigo }}>checklist</span>
                  Step-by-Step Resolution
                </div>
                {activeGuide.steps.map(([s, t, d]) => (
                  <div key={s} style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                    <div style={{ width: 28, height: 28, borderRadius: 8, flexShrink: 0, background: T.indigo + "12", border: `1px solid ${T.indigo}30`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: T.indigo }}>{s}</div>
                    <div style={{ color: T.text, fontSize: 13, paddingTop: 4, lineHeight: 1.4 }}>
                      <strong>{t}</strong><br /><span style={{ color: T.muted }}>{d}</span>
                    </div>
                  </div>
                ))}
                <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
                  <button onClick={() => setActiveGuide(null)}
                    style={{ flex: 1, background: T.gray, color: T.text, border: `1px solid ${T.border}`, borderRadius: 12, padding: "12px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                    Close Guide
                  </button>
                  <button onClick={() => setActiveGuide(null)}
                    style={{ flex: 2, background: `linear-gradient(135deg,${T.success},#10B981)`, color: "#fff", border: "none", borderRadius: 12, padding: "12px", fontSize: 13, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, boxShadow: "0 4px 16px rgba(16,185,129,0.30)" }}>
                    <span className="material-symbols-outlined" style={{ fontSize: 18 }}>check_circle</span>
                    Mark as Understood
                  </button>
                </div>
              </>
            )}
          </Modal>

          {/* SYNC LOADER OVERLAY */}
          {isSyncing && (
            <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(255,255,255,0.9)", backdropFilter: "blur(5px)", zIndex: 9999, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <div style={{ width: 64, height: 64, borderRadius: "50%", background: T.indigo + "15", color: T.indigo, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 20 }}>
                <span className="material-symbols-outlined" style={{ fontSize: 32, animation: "spin 1s linear infinite" }}>sync</span>
              </div>
              <div style={{ fontWeight: 800, fontSize: 18, color: T.text, marginBottom: 8 }}>Syncing External Portals...</div>
              <div style={{ color: T.muted, fontSize: 14 }}>
                {syncStep === 0 && "Authenticating with API Setu..."}
                {syncStep === 1 && "Connecting to National Scholarship Portal (NSP)..."}
                {syncStep === 2 && "Downloading latest scheme eligibility..."}
              </div>
              <div style={{ width: 200, height: 4, background: T.border, borderRadius: 2, marginTop: 24, overflow: "hidden" }}>
                <div style={{ width: syncStep === 0 ? "30%" : syncStep === 1 ? "60%" : "90%", height: "100%", background: T.indigo, transition: "width 1s ease" }}></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ══════════════════════════════════════
      MODULE: JOBS, INTERNSHIPS & HACKATHONS
    ══════════════════════════════════════ */

    /* ── BADGE COLORS BY TYPE ── */
    function getJobAccent(job) {
      if (job.category === 'Government') return T.indigo;
      if (job.primaryType === 'Internship') return job.secondaryType === 'Paid' ? T.success : job.secondaryType === 'Free' ? T.teal : T.orange;
      if (job.primaryType === 'Hackathon') return T.rose;
      if (job.companyType === 'product') return T.indigo;
      if (job.companyType === 'service') return T.teal;
      return T.orange;
    }

    /* ── EXPERIENCE LEVEL BADGE ── */
    function ExpBadge({ level }) {
      const colors = { Fresher: T.success, 'Entry-Level': T.teal, Junior: T.indigo, Experienced: T.orange, Unknown: T.muted };
      const c = colors[level] || T.muted;
      if (!level || level === 'Unknown') return null;
      return <span style={{ background: c + '15', color: c, border: `1px solid ${c}30`, borderRadius: 6, padding: '2px 7px', fontSize: 12, fontWeight: 700 }}>{level}</span>;
    }

    /* ── SOURCE CHIP ── */
    function SourceChip({ source }) {
      const labels = { remotive: 'Remotive', arbeitnow: 'Arbeitnow', himalayas: 'Himalayas', govtRss: 'Govt Portal', hackathon: 'Hackathon', manual: 'Manual', web: 'Web' };
      return <span style={{ fontSize: 12, color: '#6B7280', background: '#F3F4F6', borderRadius: 6, padding: '2px 7px' }}>{labels[source] || source}</span>;
    }

    /* ── JOB CARD COMPONENT ── */
    function JobCard({ j }) {
      const accent = getJobAccent(j);
      const isGovt = j.category === 'Government' || j.companyType === 'government';
      const isIntern = j.primaryType === 'Internship';
      const isHackathon = j.primaryType === 'Hackathon';

      const typeLabel = isHackathon ? '🏆 Hackathon' : isIntern ? '🎓 Internship' : '💼 Job';
      const compLabel = j.companyType === 'product' ? '🚀 Product' : j.companyType === 'service' ? '⚙️ Service' : j.companyType === 'government' ? '🏛️ Govt' : null;
      const compColor = j.companyType === 'product' ? T.indigo : j.companyType === 'service' ? T.teal : j.companyType === 'government' ? '#4F46E5' : T.muted;

      const internTag = isIntern
        ? j.secondaryType === 'Paid' ? '💰 Paid' : j.secondaryType === 'Free' ? '🆓 Free' : '❓ Compensation Unknown'
        : null;

      const postedText = j.postedAt
        ? (() => { const d = new Date(j.postedAt); const diff = Math.floor((Date.now() - d) / 86400000); return diff === 0 ? 'Today' : diff === 1 ? '1d ago' : diff < 30 ? `${diff}d ago` : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }); })()
        : j.createdAt
          ? (() => { const d = new Date(j.createdAt); const diff = Math.floor((Date.now() - d) / 86400000); return diff === 0 ? 'Today' : `${diff}d ago`; })()
          : null;

      const hasValidUrl = j.applyUrl && (j.applyUrl.startsWith('http://') || j.applyUrl.startsWith('https://'));

      return (
        <div style={{ background: '#FFFFFF', borderRadius: 8, border: '1px solid #E5E7EB', boxShadow: '0 1px 3px rgba(0,0,0,0.07)', padding: '20px 20px 16px', display: 'flex', flexDirection: 'column', gap: 0, transition: 'box-shadow .2s ease', position: 'relative', overflow: 'hidden' }}
          onMouseEnter={e => { e.currentTarget.style.boxShadow = '0 4px 14px rgba(0,0,0,0.10)'; }}
          onMouseLeave={e => { e.currentTarget.style.boxShadow = '0 1px 3px rgba(0,0,0,0.07)'; }}>
          {/* Accent bar */}
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: accent, borderRadius: '8px 8px 0 0' }} />

          {/* Header */}
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 12 }}>
            {j.companyLogo ? (
              <img src={j.companyLogo} alt={j.company} onError={e => e.target.style.display = 'none'}
                style={{ width: 38, height: 38, objectFit: 'contain', borderRadius: 8, border: `1px solid ${T.border}`, background: '#F8F8F8', padding: 3, flexShrink: 0 }} />
            ) : (
              <div style={{ width: 38, height: 38, borderRadius: 8, background: accent + '15', border: `1px solid ${accent}30`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <span className="material-symbols-outlined" style={{ fontSize: 20, color: accent }}>
                  {isGovt ? 'account_balance' : isIntern ? 'school' : isHackathon ? 'emoji_events' : 'work'}
                </span>
              </div>
            )}
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: '#1A1A1A', lineHeight: 1.35, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }}>{j.title}</div>
              <div style={{ color: '#6B7280', fontSize: 13, marginTop: 3, display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap' }}>
                <span>{j.company}</span>
                <span style={{ color: '#D1D5DB' }}>•</span>
                <span className="material-symbols-outlined" style={{ fontSize: 12 }}>location_on</span>
                <span>{j.location}</span>
              </div>
            </div>
          </div>

          {/* Badge Row */}
          <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginBottom: 10 }}>
            <span style={{ background: accent + '15', color: accent, border: `1px solid ${accent}30`, borderRadius: 6, padding: '2px 8px', fontSize: 12, fontWeight: 700 }}>{typeLabel}</span>
            {isGovt && <span style={{ background: '#4F46E510', color: '#4F46E5', border: '1px solid #4F46E530', borderRadius: 6, padding: '2px 8px', fontSize: 12, fontWeight: 700 }}>🏛️ {j.govtCategory !== 'Unknown' ? j.govtCategory : 'Govt'}</span>}
            {compLabel && !isGovt && <span style={{ background: compColor + '10', color: compColor, border: `1px solid ${compColor}30`, borderRadius: 6, padding: '2px 8px', fontSize: 12, fontWeight: 700 }}>{compLabel}</span>}
            {internTag && <span style={{ background: '#F3F4F6', color: T.muted, border: `1px solid ${T.border}`, borderRadius: 6, padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>{internTag}</span>}
            <span style={{ background: '#F3F4F6', color: T.muted, border: `1px solid ${T.border}`, borderRadius: 6, padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>{j.branch}</span>
            <ExpBadge level={j.experienceLevel} />
          </div>

          {/* Description */}
          {j.desc && <p style={{ color: '#6B7280', fontSize: 13, lineHeight: 1.55, margin: '0 0 10px', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{j.desc}</p>}

          {/* Tags */}
          {j.tags && j.tags.length > 0 && (
            <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 10 }}>
              {j.tags.slice(0, 5).map((tag, i) => (
                <span key={i} style={{ background: T.indigo + '10', color: T.indigo, border: `1px solid ${T.indigo}20`, borderRadius: 6, padding: '2px 7px', fontSize: 12, fontWeight: 600 }}>{tag}</span>
              ))}
            </div>
          )}

          {/* Meta row */}
          <div style={{ display: 'flex', gap: 10, marginBottom: 12, flexWrap: 'wrap', alignItems: 'center' }}>
            {postedText && <span style={{ fontSize: 12, color: T.muted, display: 'inline-flex', alignItems: 'center', gap: 3 }}><span className="material-symbols-outlined" style={{ fontSize: 13 }}>schedule</span>{postedText}</span>}
            {j.deadline && j.deadline !== 'Not specified' && j.deadline !== 'Rolling' && (
              <span style={{ fontSize: 12, color: T.rose, display: 'inline-flex', alignItems: 'center', gap: 3 }}><span className="material-symbols-outlined" style={{ fontSize: 13 }}>event</span>{j.deadline}</span>
            )}
            <SourceChip source={j.source} />
          </div>

          {/* Footer */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: `1px solid ${T.border}`, paddingTop: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: j.salary && j.salary !== 'Not specified' ? T.success : T.muted, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif' }}>
              {j.salary || 'Salary N/A'}
            </div>
            {hasValidUrl ? (
              <a href={j.applyUrl} target="_blank" rel="noopener noreferrer"
                style={{ background: '#FF4F1F', color: '#fff', border: 'none', borderRadius: 6, padding: '6px 13px', fontSize: 13, fontWeight: 700, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 4, transition: 'background .15s ease' }}
                onMouseEnter={e => e.currentTarget.style.background = '#E04419'}
                onMouseLeave={e => e.currentTarget.style.background = '#FF4F1F'}>
                {isHackathon ? 'Register ↗' : 'Apply Now ↗'}
              </a>
            ) : (
              <span style={{ fontSize: 11, color: T.muted, fontStyle: 'italic' }}>No direct apply link</span>
            )}
          </div>
        </div>
      );
    }

    /* ── HACKATHON CARD COMPONENT ── */
    function HackathonCard({ h }) {
      const hasUrl = h.applyUrl && (h.applyUrl.startsWith('http://') || h.applyUrl.startsWith('https://'));
      return (
        <div style={{ background: '#FFFFFF', borderRadius: 8, border: '1px solid #E5E7EB', boxShadow: '0 1px 3px rgba(0,0,0,0.07)', padding: '16px', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: T.rose, borderRadius: '8px 8px 0 0' }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
            <div style={{ width: 42, height: 42, borderRadius: 10, background: T.rose + '15', border: `1px solid ${T.rose}30`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <span className="material-symbols-outlined" style={{ fontSize: 24, color: T.rose }}>emoji_events</span>
            </div>
            <div>
              <div style={{ fontWeight: 700, fontSize: 15, color: T.text, lineHeight: 1.35 }}>{h.title}</div>
              <div style={{ color: T.muted, fontSize: 13, marginTop: 3 }}>{h.hackathonOrganizer || h.company}</div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 16, marginBottom: 12, flexWrap: 'wrap' }}>
            {h.hackathonMode && <span style={{ fontSize: 13, color: T.text, display: 'flex', alignItems: 'center', gap: 4 }}><span className="material-symbols-outlined" style={{ fontSize: 14, color: T.rose }}>laptop</span>{h.hackathonMode}</span>}
            {h.location && <span style={{ fontSize: 13, color: T.text, display: 'flex', alignItems: 'center', gap: 4 }}><span className="material-symbols-outlined" style={{ fontSize: 14, color: T.rose }}>location_on</span>{h.location}</span>}
          </div>
          {h.hackathonEligibility && <div style={{ fontSize: 13, color: T.muted, marginBottom: 10 }}>👥 {h.hackathonEligibility}</div>}
          {h.desc && <p style={{ fontSize: 14, color: T.muted, lineHeight: 1.6, marginBottom: 12 }}>{h.desc.substring(0, 150)}</p>}
          {hasUrl && (
            <a href={h.applyUrl} target="_blank" rel="noopener noreferrer"
              style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: '#FF4F1F', color: '#fff', borderRadius: 6, padding: '8px 16px', fontSize: 14, fontWeight: 600, textDecoration: 'none' }}>
              <span className="material-symbols-outlined" style={{ fontSize: 15 }}>emoji_events</span> Register Now ↗
            </a>
          )}
        </div>
      );
    }

    /* ── EMPTY STATE COMPONENT ── */
    function EmptyState({ icon, title, subtitle, onRefresh }) {
      return (
        <div style={{ textAlign: 'center', padding: '48px 24px', color: T.muted }}>
          <div style={{ marginBottom: 14 }}><span className="material-symbols-outlined" style={{ fontSize: 52, color: T.border }}>{icon}</span></div>
          <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 6, color: T.text }}>{title}</div>
          <div style={{ fontSize: 13, marginBottom: 20, lineHeight: 1.5 }}>{subtitle}</div>
          {onRefresh && (
            <button onClick={onRefresh} style={{ background: `linear-gradient(135deg,${T.teal},#0EA5E9)`, color: '#fff', border: 'none', borderRadius: 12, padding: '10px 20px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>

            </button>
          )}
        </div>
      );
    }

    /* ── SKELETON CARD ── */
    function SkeletonCard() {
      return (
        <div style={{ background: '#fff', borderRadius: 16, border: `1px solid ${T.border}`, padding: 18, height: 220 }}>
          {[75, 55, 90, 40, 65].map((w, i) => (
            <div key={i} style={{ height: 11, borderRadius: 6, background: 'linear-gradient(90deg,#F0F0F0 25%,#E8E8E8 50%,#F0F0F0 75%)', backgroundSize: '200% 100%', width: `${w}%`, marginBottom: 13, animation: 'shimmer 1.5s infinite' }} />
          ))}
        </div>
      );
    }

    /* ── MAIN COMPONENT ── */
    function InternshipJobs({ search = '' }) {
      const addToast = useToast();
      const [allJobs, setAllJobs] = useState([]);
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [activeTab, setActiveTab] = useState('all');
      const [lastRefreshResult, setLastRefreshResult] = useState(null);
      const [showRefreshDetails, setShowRefreshDetails] = useState(false);

      // Filters
      const [branchFilter, setBranchFilter] = useState('All');
      const [locationFilter, setLocationFilter] = useState('All India');
      const [companyTypeFilter, setCompanyTypeFilter] = useState('All');
      const [expLevelFilter, setExpLevelFilter] = useState('All');
      const [internCompFilter, setInternCompFilter] = useState('All');

      const loadJobs = async (silent = false) => {
        if (!silent) setLoading(true);
        try {
          const [jobsRes, statsRes] = await Promise.all([
            fetch(`${API_BASE_URL}/api/jobs?limit=300`),
            fetch(`${API_BASE_URL}/api/jobs/stats`)
          ]);
          const jobsData = await jobsRes.json();
          const statsData = await statsRes.json();

          if (jobsData.jobs && Array.isArray(jobsData.jobs)) {
            const uniqueJobsMap = new Map();
            jobsData.jobs.forEach(job => {
              const key = job.deduplicationKey || (job.source + '_' + job.sourceId) || job.applyUrl || job._id;
              if (!uniqueJobsMap.has(key)) {
                uniqueJobsMap.set(key, job);
              }
            });
            setAllJobs(Array.from(uniqueJobsMap.values()));
          }
          if (statsData.total !== undefined) {
            setStats(statsData);
          }
          setLastUpdated(new Date());
        } catch (err) {
          console.error('loadJobs error:', err);
          if (!silent) addToast('Connection Error', 'Could not reach backend at ' + API_BASE_URL, '❌', T.rose);
        } finally {
          if (!silent) setLoading(false);
        }
      };

      React.useEffect(() => { loadJobs(); }, []);
      React.useEffect(() => {
        const interval = setInterval(() => loadJobs(true), 90000);
        return () => clearInterval(interval);
      }, []);

      const handleRefresh = async () => {
        setRefreshing(true);
        addToast('Fetching Latest…', 'Syncing from all sources', '🌐', T.teal);
        try {
          const res = await fetch(`${API_BASE_URL}/api/jobs/fetch-latest`, { method: 'POST' });
          const data = await res.json();
          setLastRefreshResult(data);
          if (data.success || data.jobsAdded >= 0) {
            addToast('✅ Refreshed!', `Added ${data.jobsAdded || 0} new listings`, '🚀', T.success);
            await loadJobs();
          } else {
            addToast('⚠️ Partial Update', data.error || 'Some sources unavailable', '⚠️', T.warn);
          }
        } catch (e) {
          addToast('Network Error', 'Could not reach backend', '❌', T.rose);
        } finally {
          setRefreshing(false);
        }
      };

      // ── Apply all filters ──────────────────────────────────────────────────
      const searchLower = search.toLowerCase().trim();

      const filtered = allJobs.filter(j => {
        // Global search
        if (searchLower) {
          const hay = `${j.title} ${j.company} ${j.location} ${j.desc} ${j.branch} ${(j.tags || []).join(' ')}`.toLowerCase();
          if (!hay.includes(searchLower)) return false;
        }
        // Branch filter
        if (branchFilter !== 'All' && j.branch !== branchFilter) return false;
        // Company type filter
        if (companyTypeFilter !== 'All' && j.companyType !== companyTypeFilter) return false;
        // Experience level filter
        if (expLevelFilter !== 'All' && j.experienceLevel !== expLevelFilter) return false;
        // Location filter
        if (locationFilter !== 'All India') {
          if (locationFilter === 'Remote') { if (!j.location.toLowerCase().includes('remote')) return false; }
          else { if (!j.location.toLowerCase().includes(locationFilter.toLowerCase())) return false; }
        }
        return true;
      });

      // Tab-specific filtered views
      const tabJobs = {
        all: filtered,
        govt: filtered.filter(j => j.category === 'Government' || j.companyType === 'government'),
        private: filtered.filter(j => j.primaryType === 'Job' && j.category !== 'Government' && j.companyType !== 'government'),
        it: filtered.filter(j => j.category === 'IT' || ['CSE', 'IT', 'AI/ML', 'Data Science'].includes(j.branch)),
        engineering: filtered.filter(j => j.primaryType === 'Job' && !['CSE', 'IT', 'AI/ML', 'Data Science'].includes(j.branch) && j.category !== 'Government'),
        internships: filtered.filter(j => {
          if (j.primaryType !== 'Internship') return false;
          if (internCompFilter === 'All') return true;
          if (internCompFilter === 'Paid') return j.secondaryType === 'Paid';
          if (internCompFilter === 'Free') return j.secondaryType === 'Free';
          if (internCompFilter === 'Unknown') return j.secondaryType === 'Unknown';
          return true;
        }),
        hackathons: filtered.filter(j => j.primaryType === 'Hackathon'),
        fresher: filtered.filter(j => ['Fresher', 'Entry-Level'].includes(j.experienceLevel))
      };

      // Stat counters — from DB when available, fallback to filtered
      const dbTotal = stats ? stats.total : allJobs.length;
      const dbGovt = stats ? stats.govtJobs : tabJobs.govt.length;
      const dbInternships = stats ? stats.internships : tabJobs.internships.length;
      const dbPaid = stats ? stats.paidInternships : filtered.filter(j => j.primaryType === 'Internship' && j.secondaryType === 'Paid').length;
      const dbFree = stats ? stats.freeInternships : filtered.filter(j => j.primaryType === 'Internship' && j.secondaryType === 'Free').length;
      const dbUnknownIntern = stats ? stats.unknownInternships : filtered.filter(j => j.primaryType === 'Internship' && j.secondaryType === 'Unknown').length;
      const dbHackathons = stats ? stats.hackathons : tabJobs.hackathons.length;
      const dbFresher = stats ? stats.fresherJobs : tabJobs.fresher.length;

      // Tab definitions
      const TABS = [
        { id: 'all', icon: 'list_alt', label: 'All', count: dbTotal, color: T.indigo },
        { id: 'govt', icon: 'account_balance', label: 'Government', count: dbGovt, color: '#4F46E5' },
        { id: 'private', icon: 'business', label: 'Private', count: stats ? stats.privateJobs : tabJobs.private.length, color: T.orange },
        { id: 'it', icon: 'code', label: 'IT / Software', count: stats ? stats.itJobs : tabJobs.it.length, color: T.teal },
        { id: 'engineering', icon: 'engineering', label: 'Engineering', count: stats ? stats.engineeringJobs : tabJobs.engineering.length, color: '#F59E0B' },
        { id: 'internships', icon: 'school', label: 'Internships', count: dbInternships, color: T.success },
        { id: 'hackathons', icon: 'emoji_events', label: 'Hackathons', count: dbHackathons, color: T.rose },
        { id: 'fresher', icon: 'star', label: 'Fresher', count: dbFresher, color: '#8B5CF6' },
      ];

      const currentTabJobs = tabJobs[activeTab] || [];
      const currentTab = TABS.find(t => t.id === activeTab);

      const BRANCHES = ['All', 'CSE', 'IT', 'AI/ML', 'Data Science', 'ECE', 'EEE', 'EE', 'Mechanical', 'Civil', 'Chemical', 'Automobile', 'Aerospace', 'Biotechnology', 'Biomedical', 'Mechatronics', 'Robotics', 'Instrumentation', 'Environmental', 'Production', 'Metallurgy', 'General Engineering'];
      const LOCATIONS = ['All India', 'Remote', 'Bangalore', 'Hyderabad', 'Pune', 'Mumbai', 'Delhi', 'Noida', 'Gurugram', 'Chennai', 'Kolkata', 'Ahmedabad', 'Jaipur', 'Lucknow', 'Indore', 'Kochi', 'Chandigarh'];
      const COMPANY_TYPES = ['All', 'product', 'service', 'government', 'unknown'];
      const EXP_LEVELS = ['All', 'Fresher', 'Entry-Level', 'Junior', 'Experienced'];

      return (
        <div>
          {/* ── HERO ── */}
          <div className="screen-hero">
            <div className="screen-hero-inner">
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>

                <span style={{ background: T.success + '12', color: T.success, border: `1px solid ${T.success}25`, borderRadius: 20, padding: '3px 12px', fontSize: 11, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 4 }}>

                </span>

              </div>
              <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 30, fontWeight: 800, marginTop: 12, lineHeight: 1.15, color: '#1A1A1A', letterSpacing: '-0.2px' }}>Jobs, Internships &amp; Hackathons</h1>

            </div>
          </div>

          <div className="screen-body">

            {/* ── LIVE COUNTER STRIP ── */}
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
              {[
                { label: 'Total', val: loading ? '…' : dbTotal, c: '#374151' },
                { label: 'Government', val: loading ? '…' : dbGovt, c: '#374151' },
                { label: 'Internships', val: loading ? '…' : dbInternships, c: '#374151' },
                { label: 'Paid Internships', val: loading ? '…' : dbPaid, c: '#374151' },
                { label: 'Free Internships', val: loading ? '…' : dbFree, c: '#374151' },
                { label: 'Hackathons', val: loading ? '…' : dbHackathons, c: '#374151' },
                { label: 'Fresher Jobs', val: loading ? '…' : dbFresher, c: '#374151' },
              ].map(s => (
                <div key={s.label} style={{ background: '#FFFFFF', border: '1px solid #E5E7EB', borderRadius: 8, padding: '7px 13px', display: 'flex', alignItems: 'baseline', gap: 5 }}>
                  <span style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontWeight: 700, color: '#111827', fontSize: 19, lineHeight: 1 }}>{s.val}</span>
                  <span style={{ fontSize: 12, color: '#6B7280', fontWeight: 500 }}>{s.label}</span>
                </div>
              ))}
            </div>

            {/* ── ACTION BAR ── */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8, marginBottom: 14 }}>
              <div style={{ fontSize: 13, color: '#6B7280' }}>
                {lastUpdated && <span>Last updated: {lastUpdated.toLocaleTimeString()} • Auto-refreshes every 90s</span>}
              </div>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                {lastRefreshResult && (
                  <button onClick={() => setShowRefreshDetails(!showRefreshDetails)}
                    style={{ background: '#F9FAFB', border: '1px solid #E5E7EB', borderRadius: 6, padding: '5px 10px', fontSize: 11, color: '#6B7280', cursor: 'pointer' }}>
                    Last sync: +{lastRefreshResult.jobsAdded} new
                  </button>
                )}
                <button onClick={handleRefresh} disabled={refreshing || loading}
                  style={{ display: 'flex', alignItems: 'center', gap: 6, background: refreshing ? '#F3F4F6' : '#FF4F1F', color: refreshing ? '#6B7280' : '#fff', border: refreshing ? '1px solid #E5E7EB' : 'none', borderRadius: 6, padding: '7px 15px', fontSize: 13, fontWeight: 700, cursor: refreshing ? 'wait' : 'pointer', transition: 'all .2s ease' }}>
                  <span className="material-symbols-outlined" style={{ display: 'inline-block', fontSize: 15, animation: refreshing ? 'spin 1s linear infinite' : 'none' }}>sync</span>
                  {refreshing ? 'Fetching…' : 'Refresh Live Feed'}
                </button>
              </div>
            </div>

            {/* ── REFRESH DETAILS PANEL ── */}
            {showRefreshDetails && lastRefreshResult && (
              <div style={{ background: '#F8FAFC', border: `1px solid ${T.border}`, borderRadius: 14, padding: '14px 16px', marginBottom: 18 }}>
                <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, color: T.text }}>📊 Last Refresh Statistics</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(100px,1fr))', gap: 8, marginBottom: 12 }}>
                  {[
                    { label: 'Added', val: lastRefreshResult.jobsAdded, c: T.success },
                    { label: 'Duplicates', val: lastRefreshResult.duplicates, c: T.orange },
                    { label: 'Rejected', val: lastRefreshResult.rejected, c: T.rose },
                    { label: 'Stale Removed', val: lastRefreshResult.staleRemoved, c: T.muted }
                  ].map(s => (
                    <div key={s.label} style={{ textAlign: 'center', background: '#fff', borderRadius: 10, padding: '8px', border: `1px solid ${T.border}` }}>
                      <div style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontWeight: 700, fontSize: 16, color: s.c }}>{s.val ?? '—'}</div>
                      <div style={{ fontSize: 10, color: T.muted }}>{s.label}</div>
                    </div>
                  ))}
                </div>
                {lastRefreshResult.sources && (
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 700, color: T.muted, marginBottom: 6, textTransform: 'uppercase', letterSpacing: 0.5 }}>Per-Source Statistics</div>
                    {Object.entries(lastRefreshResult.sources).map(([name, s]) => (
                      <div key={name} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0', borderBottom: `1px solid ${T.border}`, fontSize: 12 }}>
                        <span style={{ fontWeight: 600, color: T.text, textTransform: 'capitalize' }}>{name}</span>
                        <div style={{ display: 'flex', gap: 8, color: T.muted }}>
                          <span>fetched: <b style={{ color: T.text }}>{s.fetched}</b></span>
                          <span>accepted: <b style={{ color: T.success }}>{s.accepted}</b></span>
                          <span>rejected: <b style={{ color: T.rose }}>{s.rejected}</b></span>
                          {s.error && <span style={{ color: T.rose, fontSize: 10 }}>⚠️ {s.error.substring(0, 60)}</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ── FILTER BAR ── */}
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14, padding: '10px 12px', background: '#FFFFFF', borderRadius: 8, border: '1px solid #E5E7EB' }}>
              {/* Branch */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: '1 1 140px' }}>
                <label style={{ fontSize: 11, fontWeight: 700, color: '#6B7280', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Branch</label>
                <select value={branchFilter} onChange={e => setBranchFilter(e.target.value)}
                  style={{ border: '1px solid #E5E7EB', borderRadius: 6, padding: '5px 8px', fontSize: 13, background: '#fff', color: '#111827', cursor: 'pointer', height: 32 }}>
                  {BRANCHES.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
              </div>
              {/* Location */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: '1 1 140px' }}>
                <label style={{ fontSize: 11, fontWeight: 700, color: '#6B7280', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Location</label>
                <select value={locationFilter} onChange={e => setLocationFilter(e.target.value)}
                  style={{ border: '1px solid #E5E7EB', borderRadius: 6, padding: '5px 8px', fontSize: 13, background: '#fff', color: '#111827', cursor: 'pointer', height: 32 }}>
                  {LOCATIONS.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>
              {/* Company Type */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: '1 1 140px' }}>
                <label style={{ fontSize: 11, fontWeight: 700, color: '#6B7280', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Company Type</label>
                <select value={companyTypeFilter} onChange={e => setCompanyTypeFilter(e.target.value)}
                  style={{ border: '1px solid #E5E7EB', borderRadius: 6, padding: '5px 8px', fontSize: 13, background: '#fff', color: '#111827', cursor: 'pointer', height: 32 }}>
                  {COMPANY_TYPES.map(ct => <option key={ct} value={ct}>{ct.charAt(0).toUpperCase() + ct.slice(1)}</option>)}
                </select>
              </div>
              {/* Experience Level */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: '1 1 140px' }}>
                <label style={{ fontSize: 11, fontWeight: 700, color: '#6B7280', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Experience</label>
                <select value={expLevelFilter} onChange={e => setExpLevelFilter(e.target.value)}
                  style={{ border: '1px solid #E5E7EB', borderRadius: 6, padding: '5px 8px', fontSize: 13, background: '#fff', color: '#111827', cursor: 'pointer', height: 32 }}>
                  {EXP_LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>
              {/* Reset */}
              {(branchFilter !== 'All' || locationFilter !== 'All India' || companyTypeFilter !== 'All' || expLevelFilter !== 'All') && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 2, justifyContent: 'flex-end' }}>
                  <label style={{ fontSize: 11, color: 'transparent' }}>_</label>
                  <button onClick={() => { setBranchFilter('All'); setLocationFilter('All India'); setCompanyTypeFilter('All'); setExpLevelFilter('All'); }}
                    style={{ border: '1px solid #FCA5A5', background: '#FEF2F2', color: '#EF4444', borderRadius: 6, padding: '5px 10px', fontSize: 12, fontWeight: 600, cursor: 'pointer', height: 32 }}>
                    ✕ Reset
                  </button>
                </div>
              )}
            </div>

            {/* ── TAB BAR ── */}
            <div style={{ display: 'flex', gap: 4, marginBottom: 18, flexWrap: 'wrap' }}>
              {TABS.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)}
                  style={{ flex: '0 0 auto', background: activeTab === t.id ? '#FFF7F5' : '#F9FAFB', color: activeTab === t.id ? '#FF4F1F' : '#6B7280', border: activeTab === t.id ? '1px solid #FF4F1F' : '1px solid #E5E7EB', borderRadius: 6, padding: '6px 11px', fontSize: 13, fontWeight: activeTab === t.id ? 700 : 500, cursor: 'pointer', transition: 'all .15s ease', display: 'flex', alignItems: 'center', gap: 5 }}>
                  <span style={{ whiteSpace: 'nowrap' }}>{t.label}</span>
                  <span style={{ background: activeTab === t.id ? '#FF4F1F20' : '#F3F4F6', color: activeTab === t.id ? '#FF4F1F' : '#9CA3AF', borderRadius: 10, padding: '1px 6px', fontSize: 12, fontWeight: 600 }}>
                    {loading ? '…' : t.count}
                  </span>
                </button>
              ))}
            </div>

            {/* ── INTERNSHIP COMPENSATION SUB-FILTER (only in Internships tab) ── */}
            {activeTab === 'internships' && (
              <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
                {[
                  { key: 'All', label: 'All Internships', icon: 'list_alt', count: dbInternships },
                  { key: 'Paid', label: 'Paid', icon: 'payments', count: dbPaid, c: T.success },
                  { key: 'Free', label: 'Free', icon: 'volunteer_activism', count: dbFree, c: T.teal },
                  { key: 'Unknown', label: 'Unspecified', icon: 'help_outline', count: dbUnknownIntern, c: T.muted }
                ].map(f => {
                  const isActive = internCompFilter === f.key;
                  const c = f.c || T.indigo;
                  return (
                    <button key={f.key} onClick={() => setInternCompFilter(f.key)}
                      style={{ background: isActive ? c : '#fff', color: isActive ? '#fff' : T.muted, border: `1px solid ${isActive ? c : T.border}`, borderRadius: 22, padding: '7px 16px', fontSize: 12, fontWeight: isActive ? 700 : 500, cursor: 'pointer', transition: 'all .18s ease', display: 'flex', alignItems: 'center', gap: 5 }}>
                      <span className="material-symbols-outlined" style={{ fontSize: 14 }}>{f.icon}</span>
                      {f.label}
                      <span style={{ background: isActive ? 'rgba(255,255,255,0.25)' : '#F0F0F0', borderRadius: 10, padding: '0 5px', fontSize: 10, fontWeight: 700 }}>{loading ? '…' : f.count}</span>
                    </button>
                  );
                })}
              </div>
            )}

            {/* ── HACKATHONS TAB SPECIAL CONTENT ── */}
            {activeTab === 'hackathons' && !loading && currentTabJobs.length === 0 && (
              <div style={{ background: 'linear-gradient(135deg,rgba(244,63,94,0.05),rgba(239,68,68,0.03))', border: `1px solid ${T.rose}25`, borderRadius: 18, padding: '28px 24px', marginBottom: 20, textAlign: 'center' }}>
                <span className="material-symbols-outlined" style={{ fontSize: 48, color: T.rose, display: 'block', marginBottom: 14 }}>emoji_events</span>
                <div style={{ fontWeight: 800, fontSize: 17, color: T.text, marginBottom: 8 }}>No Verified Hackathons Available Right Now</div>
                <p style={{ color: T.muted, fontSize: 13, lineHeight: 1.6, maxWidth: 480, margin: '0 auto 20px' }}>
                  No public hackathon API is available without authentication. We never show fabricated hackathon data.
                  Visit these official platforms for live hackathon listings:
                </p>
                <div style={{ display: 'flex', gap: 10, justifyContent: 'center', flexWrap: 'wrap' }}>
                  {[
                    { label: 'Devfolio', url: 'https://devfolio.co/hackathons', color: '#3B49DF' },
                    { label: 'Unstop', url: 'https://unstop.com/hackathons', color: '#FF6B35' },
                    { label: 'HackWithIndia', url: 'https://hackwithindia.in', color: '#1DA462' },

                  ].map(p => (
                    <a key={p.label} href={p.url} target="_blank" rel="noopener noreferrer"
                      style={{ background: p.color + '12', color: p.color, border: `1px solid ${p.color}30`, borderRadius: 12, padding: '9px 16px', fontSize: 13, fontWeight: 700, textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 5 }}>
                      {p.label} ↗
                    </a>
                  ))}
                </div>
              </div>
            )}

            {/* ── JOBS GRID ── */}
            {loading ? (
              <div className="grid-2">{[1, 2, 3, 4, 5, 6].map(i => <SkeletonCard key={i} />)}</div>
            ) : currentTabJobs.length === 0 && activeTab !== 'hackathons' ? (
              <EmptyState
                icon={activeTab === 'govt' ? 'account_balance' : activeTab === 'internships' ? 'school' : 'search_off'}
                title={`No ${currentTab?.label || ''} listings found`}
                subtitle={searchLower
                  ? `No results for "${search}". Try different search terms or clear filters.`

    /* ══════════════════════════════════════
      LOGIN
    ══════════════════════════════════════ */
    function Login({ onLogin }) {
      const [email, setEmail] = useState("");
      const [pass, setPass] = useState("");
      const [showPass, setShowPass] = useState(false);

      const [isRegister, setIsRegister] = useState(false);
      const [regData, setRegData] = useState({ name: "", rollNo: "", branch: "CSE", year: "1st Year", email: "", pass: "", securityQuestion: "What is your high school name?", securityAnswer: "", role: "student" });

      const QUESTIONS = [
        "What is your high school name?",
        "What is your mother's maiden name?",
        "What is the name of your first pet?",
        "What city were you born in?",
        "What was the name of your first school?",
        "What is your favorite teacher's name?"
      ];

      // Forgot Password State
      const [forgotOpen, setForgotOpen] = useState(false);
      const [forgotStep, setForgotStep] = useState(1); // 1: RollNo, 2: Q/A, 3: Done
      const [forgotInfo, setForgotInfo] = useState({ rollNo: "", question: "", answer: "", newPass: "" });

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!email || !pass) return alert("Please enter both Roll Number and Password.");

        try {
          const res = await fetch(`${API_BASE_URL}/api/users/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rollNo: email, password: pass })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.rollNo) {
              const dataWithEmail = { ...data, email: data.email || (email.includes('@') ? email : data.email || "") };
              // ✅ STABLE VERSION: No direct localStorage sets here to avoid storage quota errors.
              // The onLogin() function below handles safe, filtered storage.
              onLogin(dataWithEmail);
            }
          } else {
            const errData = await res.json().catch(() => ({}));
            alert(errData.error || "Login failed. Check your credentials.");
          }
        } catch (err) {
          alert("Server error: " + err.message);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        if (!regData.name || !regData.rollNo || !regData.email || !regData.pass || !regData.securityAnswer) {
          return alert("Please fill all fields including the Security Answer.");
        }
        try {
          const payload = {
            name: regData.name,
            rollNo: regData.rollNo,
            branch: regData.branch,
            year: regData.year,
            email: regData.email,
            password: regData.pass,
            securityQuestion: regData.securityQuestion,
            securityAnswer: regData.securityAnswer,
            role: regData.role
          };
          const response = await fetch(`${API_BASE_URL}/api/users/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            alert('✅ Registered Successfully! You can now log in.');
            setEmail(regData.rollNo);
            setPass(regData.pass);
            setIsRegister(false);
          } else {
            const err = await response.json();
            alert('Error: ' + (err?.error || 'Failed'));
          }
        } catch (error) {
          alert('Error: ' + error.message);
        }
      };

      const closeForgot = () => {
        setForgotOpen(false);
        setForgotStep(1);
        setForgotInfo({ rollNo: "", question: "", answer: "", newPass: "" });
      };

      const fetchForgotQuestion = async () => {
        if (!forgotInfo.rollNo) return alert("Enter Roll Number first.");
        try {
          const res = await fetch(`${API_BASE_URL}/api/users/forgot-password/question/${forgotInfo.rollNo}`);
          const data = await res.json();
          if (data.question) {
            setForgotInfo(p => ({ ...p, question: data.question }));
            setForgotStep(2);
          } else {
            alert(data.error || "User not found");
          }
        } catch (e) { alert("Network error"); }
      };

      const handleForgotReset = async () => {
        if (!forgotInfo.answer || !forgotInfo.newPass) return alert("Fill all fields.");
        try {
          const res = await fetch(`${API_BASE_URL}/api/users/forgot-password/reset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              rollNo: forgotInfo.rollNo,
              securityAnswer: forgotInfo.answer,
              newPassword: forgotInfo.newPass
            })
          });
          const data = await res.json();
          if (data.success) {
            alert("✨ Password updated! You can now log in.");
            closeForgot();
          } else {
            alert(data.error || "Verification failed");
          }
        } catch (e) { alert("Network error"); }
      };

      const inpSt = {

              <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 42, fontWeight: 900, lineHeight: 1.15, marginBottom: 16, color: "#fff" }}>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>

                    <div style={{ fontSize: 24 }}>{icon}</div>
                    <div style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 20, fontWeight: 700, color: "#fff", marginTop: 8 }}>{val}</div>
                    <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 11, marginTop: 5, lineHeight: 1.3 }}>{label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* RIGHT — Form */}
          <div className="login-right">
            <div style={{ width: "100%", maxWidth: 360 }}>
              <div style={{ marginBottom: 32 }}>
                <div style={{ width: 44, height: 44, borderRadius: 11, background: `linear-gradient(135deg, ${T.orange}, ${T.yellow})`, display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: 20, boxShadow: `0 6px 18px ${T.orange}44` }}>
                  <svg width="24" height="24" viewBox="0 0 44 44" fill="none">
                    <path d="M22 6 L6 14 L22 22 L38 14 Z" fill="#FFFFFF" opacity="0.95" />
                    <path d="M10 18 V28 C10 32 16 36 22 38 C28 36 34 32 34 28 V18" stroke="#FFFFFF" strokeWidth="4" fill="none" strokeLinecap="round" />
                    <path d="M22 22 V38" stroke="#FFFFFF" strokeWidth="4" strokeLinecap="round" />
                  </svg>
                </div>
                <h2 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 28, fontWeight: 900, color: T.text }}>{isRegister ? "Create Account" : "Welcome back"}</h2>
                <p style={{ color: T.muted, fontSize: 14, marginTop: 6 }}>{isRegister ? "Sign up to join your campus ecosystem" : "Log in to access your dashboard"}</p>
              </div>

              <form onSubmit={isRegister ? handleRegister : handleLogin} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                {isRegister ? (
                  <>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      <div>
                        <label style={{ color: T.muted, fontSize: 11, fontWeight: 700, display: "block", letterSpacing: .8, textTransform: "uppercase" }}>Full Name</label>
                        <input type="text" required value={regData.name} onChange={e => setRegData(p => ({ ...p, name: e.target.value }))} style={{ ...inpSt, marginTop: 6 }} placeholder="e.g. Dev Kumar" />
                      </div>
                      <div>
                        <label style={{ color: T.muted, fontSize: 11, fontWeight: 700, display: "block", letterSpacing: .8, textTransform: "uppercase" }}>Roll Number</label>
                        <input type="text" required value={regData.rollNo} onChange={e => setRegData(p => ({ ...p, rollNo: e.target.value }))} style={{ ...inpSt, marginTop: 6 }} placeholder="e.g. 2200123..." />

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      <div>

                        <select value={regData.branch} onChange={e => setRegData(p => ({ ...p, branch: e.target.value }))} style={{ ...inpSt, padding: "12px 16px", marginTop: 6 }}>

                      <div>

                    <div style={{ position: "relative" }}>
                      <label style={{ color: T.muted, fontSize: 11, fontWeight: 700, display: "block", letterSpacing: .8, textTransform: "uppercase" }}>Password</label>
                      <input type={showPass ? "text" : "password"} required value={regData.pass} onChange={e => setRegData(p => ({ ...p, pass: e.target.value }))} style={{ ...inpSt, marginTop: 6, paddingRight: 40 }} placeholder="Create a password…" />
                      <button type="button" onClick={(e) => { e.preventDefault(); setShowPass(!showPass); }} style={{ position: "absolute", right: 12, top: 38, background: "none", border: "none", cursor: "pointer", fontSize: 16 }}>
                        {showPass ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>visibility</span> : <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>visibility_off</span>}
                      </button>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      <div>
                        <label style={{ color: T.muted, fontSize: 11, fontWeight: 700, display: "block", letterSpacing: .8, textTransform: "uppercase" }}>Security Question</label>
                        <select value={regData.securityQuestion} onChange={e => setRegData(p => ({ ...p, securityQuestion: e.target.value }))} style={{ ...inpSt, padding: "12px 16px", marginTop: 6 }}>

                <a href="#" onClick={(e) => { e.preventDefault(); setIsRegister(!isRegister); }} style={{ color: T.orange, fontSize: 13, textDecoration: "none", fontWeight: 700 }}>{isRegister ? "Log In →" : "Register →"}</a>
              </div>

              {/* FORGOT PASSWORD MODAL */}
              <Modal open={forgotOpen} onClose={closeForgot} title="🔑 Reset Password">
                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  {forgotStep === 1 && (
                    <>
                      <p style={{ fontSize: 13, color: T.muted }}>Enter your Roll Number to find your account.</p>
                      <input style={inpSt} placeholder="Roll Number" value={forgotInfo.rollNo} onChange={e => setForgotInfo(p => ({ ...p, rollNo: e.target.value }))} />

                      <div style={{ position: "relative" }}>

              </Modal>

              {!isRegister && (
                <div style={{ marginTop: 24, padding: "12px 14px", borderRadius: 11, background: "rgba(255,79,31,0.04)", border: "1px solid rgba(255,79,31,0.15)", display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 14 }}>💡</span>

              )}
            </div>
          </div>
        </div>
      );
    }

            fetch(`${API_BASE_URL}/api/scholarships/admin/all`),

          console.error("Database connection error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchRealData();
      }, []);

      // ── FETCH JOBS FROM MONGODB ──
      const loadAdminJobs = async () => {
        setJobsLoading(true);
        try {
          const [jobsRes, statsRes] = await Promise.all([
            fetch(`${API_BASE_URL}/api/jobs`),
            fetch(`${API_BASE_URL}/api/jobs/stats/summary`)
          ]);
          if (jobsRes.ok) setAllJobsAdmin(await jobsRes.json());
          if (statsRes.ok) setJobStats(await statsRes.json());
        } catch (err) { console.error("Jobs fetch error:", err); }
        finally { setJobsLoading(false); }
      };

      useEffect(() => { loadAdminJobs(); }, []);

      // ── FETCH LATEST JOBS FROM WEB ──
      const handleFetchLatest = async () => {
        setFetchingJobs(true);
        addToast("Fetching from Web…", "Syncing internship & job feeds", "🌐", T.teal);
        try {
          const res = await fetch(`${API_BASE_URL}/api/jobs/fetch-latest`, { method: "POST" });
          const data = await res.json();
          if (data.success) {
            addToast("✅ Sync Complete!", data.message, "🚀", T.success);
            loadAdminJobs();
          } else { addToast("⚠️ Partial", data.error || "Some feeds failed", "⚠️", T.warn); }
        } catch (e) { addToast("Network Error", "Backend unreachable", "❌", T.rose); }
        finally { setFetchingJobs(false); }
      };

      // ── ADD JOB (ADMIN) ──
      const handleAddJob = async () => {
        if (!newJob.title || !newJob.company || !newJob.location || !newJob.salary || !newJob.desc) {
          return addToast("Missing Fields", "Fill all required fields", "⚠️", T.warn);
        }
        try {
          const payload = { ...newJob, tags: (newJob.tags || "").split(",").map(t => t.trim()).filter(Boolean), source: "manual" };
          const res = await fetch(`${API_BASE_URL}/api/jobs`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          if (res.ok) {
            addToast("Job Added ✅", `${newJob.title} at ${newJob.company} saved to DB`, "💼", T.success);
            setNewJob({ title: "", company: "", location: "", salary: "", desc: "", primaryType: "Internship", secondaryType: "Paid", isAktu: false, applyUrl: "", deadline: "", experience: "Fresher", tags: "", badge: "New ✨" });
            setAddJobForm(false);
            loadAdminJobs();
          } else { addToast("Error", "Failed to save job", "❌", T.rose); }
        } catch (e) { addToast("Network Error", e.message, "❌", T.rose); }
      };

      // ── DELETE JOB (ADMIN) ──
      const handleDeleteJob = async (id, title) => {
        if (!window.confirm(`Delete "${title}"?`)) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/jobs/${id}`, { method: "DELETE" });
          if (res.ok) {
            addToast("Deleted", `"${title}" removed from DB`, "🗑️", T.rose);
            setAllJobsAdmin(prev => prev.filter(j => j._id !== id));
            loadAdminJobs();
          }
        } catch (e) { addToast("Error", "Delete failed", "❌", T.rose); }
      };

      // ── FUNCTIONAL APPROVAL ACTION ──
      const handleScholarshipAction = async (appId, status) => {
        try {
          const res = await fetch(`${API_BASE_URL}/api/scholarships/admin/application/${appId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status })
          });

          if (res.ok) {
            setAdminScholarships(prev => prev.map(a => a._id === appId ? { ...a, status } : a));
            addToast(`${status} ✅`, `Application ${appId.slice(-4).toUpperCase()} updated`, status === 'Approved' ? <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span> : <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>cancel</span>, status === 'Approved' ? T.success : T.rose);
          }
        } catch (err) {
          addToast("DB Error", "Update failed", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>cancel</span>, T.rose);
        }
      };

      // ── DYNAMIC COUNTERS CALCULATION ──
      const totalCount = students.length;
      const pendingCount = adminScholarships.filter(s => s.status === 'Applied').length;
      const approvedCount = adminScholarships.filter(s => s.status === 'Approved').length;
      const rejectedCount = adminScholarships.filter(s => s.status === 'Rejected').length;

      const statusColor = (status) => {
        if (status === "Approved") return T.success;
        if (status === "Rejected") return T.rose;
        return T.warn;
      };

      const getStatus = (stage) => {
        const stages = ["Rejected", "Applied", "Under Review", "Approved", "Credited"];
        return (stages[stage] || "Pending");
      };

      const handleApprove = async (rollNo) => {
        addToast("Updating Status...", "Connecting to MongoDB", "⏳", T.teal);
        try {
          const res = await fetch(`${API_BASE_URL}/api/users/update-status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rollNo, scholarshipStage: 3 })
          });
          if (res.ok) {
            setStudents(prev => prev.map(s => s.rollNo === rollNo ? { ...s, scholarshipStage: 3 } : s));
            addToast("Approved ✓", `Student ${rollNo} verified successfully.`, "✅", T.success);
          }
        } catch (err) {
          addToast("Error", "Failed to update status", "❌", T.rose);
        }
      };

      const handleReject = async (rollNo) => {
        if (!window.confirm("Reject this student's scholarship verification?")) return;
        addToast("Updating Status...", "Connecting to MongoDB", "⏳", T.teal);
        try {
          const res = await fetch(`${API_BASE_URL}/api/users/update-status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rollNo, scholarshipStage: 0 })
          });
          if (res.ok) {
            setStudents(prev => prev.map(s => s.rollNo === rollNo ? { ...s, scholarshipStage: 0 } : s));
            addToast("Rejected ✕", `Student ${rollNo} verification rejected.`, "❌", T.rose);

        } catch (err) {
          addToast("Error", "Failed to update status", "❌", T.rose);
        }

          const res = await fetch(`${API_BASE_URL}/api/users/approve-profile-unlock`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rollNo })

          if (res.ok) {

          addToast("Error", "Failed to unlock profile", "❌", T.rose);

            </Card>
          </div>
        </div>

                  <div style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 32, fontWeight: 700, color: T.indigo }}>{totalCount.toLocaleString()}</div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14, color: T.text }}>Total Registered Students</div>
                    <div style={{ color: T.muted, fontSize: 12, marginTop: 2 }}>Across all branches and years — AKTU Lucknow</div>
                  </div>
                </Card>

                {/* Student Search Bar */}
                <div style={{ flex: 1, minWidth: 280, display: "flex", alignItems: "center", background: "#FFF", border: "1px solid #E8E8E8", borderRadius: 12, padding: "0 16px", boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 20, color: "#1E3A8A", flexShrink: 0, fontWeight: 300 }}>search</span>
                  <input
                    type="text"
                    placeholder="Search by name, roll no, or branch..."
                    value={studentSearch}
                    onChange={e => setStudentSearch(e.target.value)}
                    style={{ border: "none", outline: "none", background: "transparent", fontSize: 14, width: "100%", padding: "16px 12px", color: T.text }}
                  />
                  {studentSearch && <span className="material-symbols-outlined" onClick={() => setStudentSearch("")} style={{ color: T.muted, cursor: "pointer", fontSize: 16 }}>close</span>}
                </div>
              </div>

              <Card style={{ padding: 0, overflow: "hidden" }}>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse" }}>
                    <thead>
                      <tr style={{ background: "#F8F8F8" }}>
                        {["Name", "Roll No.", "Branch", "Income (Annual)", "FW", "Category", "Scholarship"].map(h => <th key={h} style={thStyle}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {filteredStudents.length === 0 ? (
                        <tr>
                          <td colSpan="8" style={{ padding: "40px 20px", textAlign: "center", color: T.muted, fontSize: 14 }}>
                            No students match "{studentSearch}"
                          </td>
                        </tr>
                      ) : filteredStudents.map((s, i) => {
                        return (
                          <tr key={s.rollNo} style={{ borderTop: "1px solid #F0F0F0", background: i % 2 === 0 ? "#fff" : "#FAFAFA" }}>
                            <td style={{ padding: "13px 16px", fontWeight: 600, fontSize: 13, color: T.text }}>{s.name}</td>
                            <td style={{ padding: "13px 16px", fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 12, color: T.muted }}>{s.rollNo}</td>
                            <td style={{ padding: "13px 16px", fontSize: 13 }}>{s.branch || "CSE"}</td>
                            <td style={{ padding: "13px 16px", fontSize: 13, fontWeight: 700, color: T.success }}>₹{(s.familyIncome || 0).toLocaleString()}</td>
                            <td style={{ padding: "13px 16px", fontSize: 13 }}>{s.isFeeWaiver ? <span style={{ color: T.rose, fontWeight: 800 }}>YES</span> : "No"}</td>
                            <td style={{ padding: "13px 16px", fontSize: 13 }}><Badge color={T.indigo}>{s.casteCategory || "Gen"}</Badge></td>
                            <td style={{ padding: "13px 16px", fontSize: 12 }}>{s.scholarship || "UP Post-Matric"}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </Card>
            </div>
          </div>
        );
      })();

      const approvalsContent = (() => {
        const pending = students.filter(s => (s.scholarshipStage || 0) < 3);
        return (
          <div className="fade-up">
            <div className="screen-hero">
              <div className="screen-hero-inner">
                <Badge color={T.warn}>✅ Approvals Queue</Badge>
                <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 32, fontWeight: 900, color: T.text, marginTop: 12 }}>Pending Approvals</h1>
                <p style={{ color: T.muted, fontSize: 14, marginTop: 8 }}>{pending.length} applications awaiting your review.</p>
              </div>
            </div>
            <div className="screen-body">
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {pending.map((s) => (
                  <Card key={s.rollNo} style={{ display: "flex", alignItems: "center", gap: 16, padding: "16px 20px" }}>
                    <div style={{ width: 44, height: 44, borderRadius: 11, background: `linear-gradient(135deg,${T.orange},${T.yellow})`, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 18, color: "#111", flexShrink: 0 }}>{s.name ? s.name[0] : ""}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 14, color: T.text }}>{s.name}</div>
                      <div style={{ color: T.muted, fontSize: 12, marginTop: 2 }}>{s.rollNo} · {s.branch || "CSE"} · {s.year || "3rd Year"}</div>

                    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: statusColor(getStatus(s.scholarshipStage)) + "18", color: statusColor(getStatus(s.scholarshipStage)), border: `1px solid ${statusColor(getStatus(s.scholarshipStage))}38`, borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{getStatus(s.scholarshipStage)}</span>
                    <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                      <button onClick={() => handleApprove(s.rollNo)} style={{ background: T.success + "18", color: T.success, border: `1px solid ${T.success}38`, borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", transition: "all .15s ease" }}>Approve ✓</button>
                      <button onClick={() => handleReject(s.rollNo)} style={{ background: T.rose + "18", color: T.rose, border: `1px solid ${T.rose}38`, borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", transition: "all .15s ease" }}>Reject ✕</button>
                    </div>
                  </Card>
                ))}
                {pending.length === 0 && (
                  <div style={{ padding: 40, textAlign: 'center', color: T.muted, fontSize: 16 }}>No pending approvals.</div>

              </div>
            </div>
          </div>
        );
      })();

      const unlockApprovalsContent = (() => {
        const pendingUnlocks = students.filter(s => s.profileEditRequested);
        return (
          <div className="fade-up">
            <div className="screen-hero">
              <div className="screen-hero-inner">
                <Badge color={T.indigo}>🔓 Profile Unlock Requests</Badge>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
                  <h1 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 32, fontWeight: 900, color: T.text, margin: 0 }}>Unlock Approvals</h1>
                  <button onClick={fetchRealData} style={{ background: "#F5F5F5", border: "1px solid #E8E8E8", borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", color: T.text, display: "flex", alignItems: "center", gap: 6 }}>
                    <span className="material-symbols-outlined" style={{ fontSize: 18 }}>refresh</span>
                    Refresh Requests
                  </button>
                </div>
                <p style={{ color: T.muted, fontSize: 14, marginTop: 8 }}>{pendingUnlocks.length} students requesting to re-edit their profiles.</p>
              </div>
            </div>
            <div className="screen-body">
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {pendingUnlocks.length === 0 ? (
                  <div style={{ padding: 60, textAlign: 'center', color: T.muted, fontSize: 16 }}>

                    <div style={{ flex: 1, minWidth: 0 }}>

                        Approve Unlock

      // ── JOBS MANAGEMENT PANEL ──
      const inpStyle = { width: "100%", padding: "10px 14px", background: "#F8F8F8", border: `1.5px solid ${T.border}`, borderRadius: 10, fontSize: 13, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', color: T.text, outline: "none", transition: "border-color .18s" };
      const jobsContent = (
