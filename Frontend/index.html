<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidya-Setu — Student Web Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700;900&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Nunito+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: #F9FAFB;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #F5F5F5;
    }

    ::-webkit-scrollbar-thumb {
      background: #E0E0E0;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #BDBDBD;
    }

    /* ══════════════════════════════════
        ANIMATIONS
      ══════════════════════════════════ */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 12px rgba(255, 79, 31, 0.20);
      }

      50% {
        box-shadow: 0 0 24px rgba(255, 79, 31, 0.38);
      }
    }

    @keyframes pulseAlert {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes scanLine {
      0% {
        top: 8px;
      }

      100% {
        top: calc(100% - 8px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(120%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes statusPop {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      60% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }


    @keyframes greenGlow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }

      50% {
        box-shadow: 0 0 14px 4px rgba(34, 197, 94, 0.18);
      }
    }

    @keyframes profilePop {
      0% {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes badgeBounce {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      60% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0);
        opacity: 0.4;
      }

      100% {
        transform: scale(4);
        opacity: 0;
      }
    }

    @keyframes dots {

      0%,
      20% {
        content: '.';
      }

      40% {
        content: '..';
      }

      60%,
      100% {
        content: '...';
      }
    }

    @keyframes sidebarSlide {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ══════════════════════════════════
        UTILITY CLASSES
      ══════════════════════════════════ */
    .fade-up {
      animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .slide-in {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .status-pop {
      animation: statusPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .profile-pop {
      animation: profilePop 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .badge-bounce {
      animation: badgeBounce 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .toast-anim {
      animation: toastIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    }


    .green-glow {
      animation: greenGlow 2s ease-in-out infinite;
    }

    .card-hover {
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.10);
      border-color: rgba(255, 79, 31, 0.30) !important;
    }

    .btn-press {
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-press:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      filter: brightness(1.06);
    }

    .btn-press:active {
      transform: translateY(1px) scale(0.97) !important;
    }

    .ripple-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.28);
      transform: scale(0);
      opacity: 0;
    }

    .ripple-btn:active::after {
      animation: ripple .4s ease-out;
    }

    .icon-hover {
      transition: transform .2s ease;
    }

    .icon-hover:hover {
      transform: scale(1.15);
    }

    .shimmer-text {
      background: linear-gradient(90deg, #FF4F1F, #FFC700, #FF4F1F);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    .prog-fill {
      transition: width .8s cubic-bezier(.4, 0, .2, 1);
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    select,
    input,
    button {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    select {
      -webkit-appearance: none;
      appearance: none;
      transition: border-color .2s;
    }

    select:hover,
    input:hover {
      border-color: #FF4F1F44 !important;
    }

    select:focus,
    input:focus,
    button:focus {
      outline: none;
      border-color: #FF4F1F88 !important;
    }

    .scan-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FF4F1F, transparent);
      animation: scanLine 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 10px #FF4F1F88;
    }

    /* ══════════════════════════════════
        LAYOUT SYSTEM
      ══════════════════════════════════ */
    :root {
      --sidebar-w: 256px;
      --header-h: 64px;
      --content-max: 1100px;
    }

    .vs-shell {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #FAFAFA;
    }

    /* ── SIDEBAR ── */
    .vs-sidebar {
      width: var(--sidebar-w);
      background: #111111;
      border-right: 1px solid #E8E8E8;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 60;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      animation: sidebarSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .vs-sidebar::-webkit-scrollbar {
      width: 0;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 22px 18px 18px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(145deg, #1A1A1A 0%, #0D0D0D 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #111;
      font-size: 12px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(255, 79, 31, 0.25), 0 0 0 1.5px rgba(255, 79, 31, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .brand-logo::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 79, 31, 0.15), transparent, rgba(255, 199, 0, 0.1), transparent);
      animation: logoBorderSpin 6s linear infinite;
      pointer-events: none;
    }

    @keyframes logoBorderSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .brand-text-name {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #FFFFFF 30%, #FFD4C0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-text-sub {
      font-size: 9.5px;
      color: #666;
      margin-top: 4px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .sidebar-nav {
      flex: 1;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-section-label {
      font-size: 10px;
      color: #555;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 10px 10px 4px;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: #666;
      font-size: 13px;
      font-weight: 600;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      width: 100%;
      position: relative;
    }

    .sidebar-nav-item:hover {
      background: #1A1A1A;
      color: #ccc;
      border-color: #333;
    }

    .sidebar-nav-item.active {
      background: linear-gradient(135deg, rgba(255, 79, 31, 0.16), rgba(255, 79, 31, 0.07));
      color: #fff;
      border-color: rgba(255, 79, 31, 0.35);
      font-weight: 700;
    }

    .sidebar-nav-item.active .nav-icon {
      transform: scale(1.05);
    }

    .nav-icon {
      font-size: 16px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
      width: 20px;
      text-align: center;
    }

    .nav-label {
      flex: 1;
    }

    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #FF4F1F;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 12px 10px 16px;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }

    .sidebar-user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar-user-card:hover {
      border-color: rgba(255, 79, 31, 0.4);
      background: #222;
    }

    .user-ava {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF4F1F, #FFC700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #111;
      font-size: 12px;
      flex-shrink: 0;
    }

    .user-nm {
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }

    .user-mt {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    /* ── MAIN PANEL ── */
    .vs-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }

    /* ── HEADER ── */
    .vs-header {
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 14px;
      flex-shrink: 0;
      z-index: 50;
    }

    .header-logo-mobile {
      display: none;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-right: 4px;
    }

    .header-search-wrap {
      flex: 1;
      max-width: 520px;
      display: flex;
      align-items: center;
      background: #F5F5F5;
      border-radius: 10px;
      padding: 9px 14px;
      border: 1.5px solid #EBEBEB;
      gap: 8px;
      transition: border-color 0.2s, background 0.2s;
    }

    .header-search-wrap:focus-within {
      border-color: #FF4F1F88;
      background: #fff;
    }

    .header-search-input {
      background: transparent;
      border: none;
      color: #1A1A1A;
      font-size: 14px;
      width: 100%;
      outline: none;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .header-search-input::placeholder {
      color: #AAA;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .mobile-menu-btn {
      display: none;
      background: #F5F5F5;
      border: 1.5px solid #EBEBEB;
      color: #555;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .mobile-menu-btn:hover {
      background: #EBEBEB;
    }

    /* ── CONTENT ── */
    .vs-content {
      flex: 1;
      overflow-y: auto;
      position: relative;
      background: #FAFAFA;
    }

    /* ── SCREEN STRUCTURE ── */
    .screen-hero {
      background: linear-gradient(158deg, #FFFFFF 0%, #FFF9F5 52%, #FFF4EC 100%);
      border-bottom: 1px solid #EBEBEB;
      padding: 36px 44px;
      position: relative;
      overflow: hidden;
    }

    .screen-hero::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 79, 31, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .screen-hero-inner {
      max-width: var(--content-max);
      margin: 0 auto;
      position: relative;
    }

    .screen-body {
      padding: 36px 44px 72px;
      max-width: calc(var(--content-max) + 88px);
      margin: 0 auto;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── RESPONSIVE GRIDS ── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .grid-auto {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .two-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .two-panel-3-2 {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 24px;
      align-items: start;
    }

    .two-panel-wide {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .home-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    .home-modules {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    /* ── MOBILE BOTTOM NAV ── */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid #EBEBEB;
      z-index: 70;
      padding: 8px 4px 12px;
    }

    /* ── SIDEBAR MOBILE OVERLAY ── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 55;
      animation: fadeUp 0.2s ease;
    }

    .sidebar-overlay.open {
      display: block;
    }

    /* ══════════════════════════════════
        MODAL
      ══════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 15, 0.55);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      animation: fadeUp .2s ease;
    }

    .modal-sheet {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 28px;
      border-top: 1px solid #EBEBEB;
      box-shadow: 0 -10px 60px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 960px) {
      .modal-overlay.above-nav-overlay {
        padding-bottom: 74px;
      }

      .modal-sheet.above-nav-sheet {
        border-radius: 24px;
        border: 1px solid #EBEBEB;
      }
    }



    /* ══════════════════════════════════
        LOGIN
      ══════════════════════════════════ */
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      background: #FAFAFA;
    }

    .login-left {
      flex: 1;
      background: linear-gradient(150deg, #FF4F1F 0%, #FF6B3D 45%, #FFC700 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 48px;
      position: relative;
      overflow: hidden;
    }

    .login-right {
      width: 460px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      border-left: 1px solid #EBEBEB;
      background: #fff;
    }

    /* ══════════════════════════════════
        TOAST
      ══════════════════════════════════ */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 300px;
    }

    /* AI FAB */
    .ai-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 100;
    }

    /* ══════════════════════════════════
        RESPONSIVE BREAKPOINTS
      ══════════════════════════════════ */
    @media (max-width: 1100px) {
      :root {
        --sidebar-w: 220px;
      }

      .screen-body {
        padding: 28px 32px 60px;
      }

      .screen-hero {
        padding: 28px 32px;
      }

      .home-stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .home-modules {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 960px) {
      .vs-sidebar {
        position: fixed;
        transform: translateX(-100%);
        box-shadow: none;
        height: 100%;
      }

      .vs-sidebar.sidebar-open {
        transform: translateX(0);
        box-shadow: 6px 0 40px rgba(0, 0, 0, 0.2);
      }

      .vs-header {
        padding: 0 16px;
      }

      .header-logo-mobile {
        display: flex;
      }

      .mobile-menu-btn {
        display: flex !important;
      }

      .mobile-bottom-nav {
        display: flex;
      }

      .screen-body {
        padding: 20px 18px 80px;
      }

      .screen-hero {
        padding: 22px 18px 26px;
      }

      .two-panel {
        grid-template-columns: 1fr;
      }

    /* ══════════════════════════════════════════════
        SPLASH SCREEN
      ══════════════════════════════════════════════ */
    @keyframes splashFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes splashFadeOut {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(1.04);
      }
    }

    @keyframes splashLogoFloat {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.03);
      }
    }

    @keyframes splashLogoReveal {
      0% {
        opacity: 0;
        transform: scale(0.6) rotate(-8deg);
      }

      60% {
        transform: scale(1.08) rotate(2deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes splashTextReveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splashBar {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    @keyframes splashDot1 {

      0%,
      60%,
      100% {
        transform: scale(1);
        opacity: .4
      }

      30% {
        transform: scale(1.4);
        opacity: 1
      }
    }

    @keyframes splashDot2 {

      0%,
      60%,
      100% {
        transform: scale(1);
        opacity: .4
      }

      45% {
        transform: scale(1.4);
        opacity: 1
      }
    }

    @keyframes splashDot3 {

      0%,
      60%,
      100% {
        transform: scale(1);
        opacity: .4
      }

      60% {
        transform: scale(1.4);
        opacity: 1
      }
    }

    @keyframes orbPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.15;
      }

      50% {
        transform: scale(1.25);
        opacity: 0.28;
      }
    }

    @keyframes orbPulse2 {

      0%,
      100% {
        transform: scale(1.1);
        opacity: 0.1;
      }

      50% {
        transform: scale(0.85);
        opacity: 0.22;
      }
    }

    @keyframes glowRing {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 79, 31, 0);
      }

      50% {
        box-shadow: 0 0 0 16px rgba(255, 79, 31, 0.12);
      }
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0D0D0D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashFadeIn 0.5s ease both;
      overflow: hidden;
    }

    .splash-screen.exit {
      animation: splashFadeOut 0.55s cubic-bezier(0.4, 0, 0.6, 1) both;
      pointer-events: none;
    }

    .splash-orb-1 {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 79, 31, 0.22) 0%, transparent 70%);
      top: -160px;
      left: -120px;
      animation: orbPulse 4s ease-in-out infinite;
    }

    .splash-orb-2 {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 199, 0, 0.16) 0%, transparent 70%);
      bottom: -100px;
      right: -80px;
      animation: orbPulse2 5s ease-in-out infinite;
    }

    .splash-orb-3 {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      top: 40%;
      right: 8%;
      animation: orbPulse 6s ease-in-out infinite 1s;
    }

    .splash-logo-wrap {
      animation: splashLogoReveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both,
        splashLogoFloat 3s ease-in-out 1s infinite;
      position: relative;
    }

    .splash-logo-icon {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(145deg, #111111 0%, #0A0A0A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #111;
      font-size: 30px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      box-shadow: 0 20px 60px rgba(255, 79, 31, 0.35), 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 1.5px rgba(255, 79, 31, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: glowRing 2.5s ease-in-out 1s infinite;
      position: relative;
      overflow: hidden;
    }

    .splash-logo-icon::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 79, 31, 0.18), transparent, rgba(255, 199, 0, 0.12), transparent);
      animation: logoBorderSpin 5s linear infinite;
      pointer-events: none;
    }

    .splash-logo-icon::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      border: 1.5px solid rgba(255, 79, 31, 0.3);
      pointer-events: none;
      animation: glowRing 3s ease-in-out 1.5s infinite;
    }

    .splash-title {
      margin-top: 24px;
      text-align: center;
      animation: splashTextReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
    }

    .splash-title-main {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, #FFFFFF 20%, #FFD4C0 50%, #FF4F1F 80%, #FFC700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      animation: shimmer 4s linear infinite;
    }

    .splash-title-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .splash-loader {
      margin-top: 44px;
      width: 200px;
      animation: splashTextReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both;
    }

    .splash-loader-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
    }

    .splash-loader-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #FF4F1F, #FFC700);
      animation: splashBar 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
    }

    .splash-dots {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-top: 18px;
    }

    .splash-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 79, 31, 0.7);
    }

    .splash-dots span:nth-child(1) {
      animation: splashDot1 1.4s ease-in-out infinite;
    }

    .splash-dots span:nth-child(2) {
      animation: splashDot2 1.4s ease-in-out infinite;
    }

    .splash-dots span:nth-child(3) {
      animation: splashDot3 1.4s ease-in-out infinite;
    }

    }

    .card-hover:hover {
      transform: translateY(-4px) !important;

      border-color: rgba(255, 79, 31, 0.28) !important;
    }

    /* ── ENHANCED BUTTON ── */
    .btn-press {
      transition: transform .18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .18s ease, filter .15s ease !important;
      overflow: hidden !important;

    .btn-press::before {
      content: "";

      top: 0;
      left: -100%;
      width: 60%;

      transition: none;
      pointer-events: none;

    .btn-press:hover::before {

    }

    .btn-press:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14) !important;

    .btn-press:active {

    /* ══════════════════════════════════════════════
        DESIGN TOKENS — SINGLE SOURCE OF TRUTH
      ══════════════════════════════════════════════ */
    :root {
      /* Primary palette */
      --c-primary: #FF4F1F;
      --c-primary-lt: #FF6B3D;
      --c-primary-soft: rgba(255, 79, 31, 0.07);
      --c-primary-tint: rgba(255, 79, 31, 0.12);
      --c-primary-border: rgba(255, 79, 31, 0.22);

      /* Secondary palette */
      --c-secondary: #FFC700;
      --c-secondary-soft: rgba(255, 199, 0, 0.10);
      --c-secondary-tint: rgba(255, 199, 0, 0.18);

      /* Semantic */
      --c-success: #22C55E;
      --c-success-soft: rgba(34, 197, 94, 0.08);
      --c-success-tint: rgba(34, 197, 94, 0.14);
      --c-success-border: rgba(34, 197, 94, 0.28);

      --c-danger: #EF4444;
      --c-danger-soft: rgba(239, 68, 68, 0.07);
      --c-danger-tint: rgba(239, 68, 68, 0.12);
      --c-danger-border: rgba(239, 68, 68, 0.25);

      --c-warn: #F59E0B;
      --c-warn-soft: rgba(245, 158, 11, 0.08);
      --c-warn-tint: rgba(245, 158, 11, 0.14);
      --c-warn-border: rgba(245, 158, 11, 0.25);

      --c-indigo: #6366F1;
      --c-indigo-soft: rgba(99, 102, 241, 0.08);
      --c-teal: #14B8A6;
      --c-teal-soft: rgba(20, 184, 166, 0.08);

      /* Surface */
      --c-surface: #FFFFFF;
      --c-surface-2: #FAFAFA;
      --c-surface-3: #F5F5F5;
      --c-border: #EBEBEB;
      --c-border-strong: #E0E0E0;
      --c-text: #1A1A1A;
      --c-text-muted: #888888;
      --c-text-faint: #B0B0B0;

      /* Spacing */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      /* Shadows */
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.10);
      --shadow-primary: 0 4px 18px rgba(255, 79, 31, 0.28);
    }

    /* ── GLOBAL INPUT / SELECT POLISH ── */
    input,
    select,
    textarea {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important;
      transition: border-color 0.18s ease, box-shadow 0.18s ease !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none !important;
      border-color: rgba(255, 79, 31, 0.50) !important;
      box-shadow: 0 0 0 3px rgba(255, 79, 31, 0.09) !important;
    }

    input:hover:not(:focus),
    select:hover:not(:focus) {
      border-color: rgba(255, 79, 31, 0.30) !important;
    }

    /* ── SIDEBAR ACTIVE ITEM — LEFT ACCENT ── */
    .sidebar-nav-item.active::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: #FF4F1F;
    }

    /* ── CARD COMPONENT CONSISTENCY ── */
    .card-hover {
      border-radius: var(--radius-lg) !important;
    }

    /* ── PROGRESS BAR TRACK ── */
    .prog-track {
      background: #F0F0F0;
      border-radius: 99px;
      overflow: hidden;
    }

    /* ── REFINED BADGE ── */
    .badge-base {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    /* ── TOAST UPGRADE ── */
    .toast-anim {
      background: rgba(255, 255, 255, 0.98) !important;
      backdrop-filter: blur(20px) !important;

    /* ── MOBILE NAV ACTIVE LABEL ── */
    .mobile-bottom-nav {
      background: rgba(255, 255, 255, 0.98) !important;
      backdrop-filter: blur(24px) !important;
    }

    /* ── INPUT STYLE REFINEMENT FOR FORM ELEMENTS ── */
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--c-surface-3);
      color: var(--c-text);
      border: 1.5px solid var(--c-border);

      font-size: 14px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

    /* ── ACTIVEBORDERGLOW override (remove duplicate) ── */
    @keyframes activeBorderGlow {

      0%,
      100% {
        border-color: rgba(255, 79, 31, 0.32);
        box-shadow: inset 0 0 0 1px rgba(255, 79, 31, 0.32), 0 2px 12px rgba(255, 79, 31, 0.10);
      }

      50% {
        border-color: rgba(255, 79, 31, 0.55);
        box-shadow: inset 0 0 0 1px rgba(255, 79, 31, 0.55), 0 2px 16px rgba(255, 79, 31, 0.18);
      }

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.protocol === 'file:')
      ? 'http://localhost:5000'
      : 'https://vidya-setu-api.onrender.com';

    const { useState, useEffect, useRef, createContext, useContext } = React;

    /* ─── CONTEXTS ─── */
    const UserContext = createContext(null);
    const ToastContext = createContext(null);
    const useUser = () => useContext(UserContext) || { user: {}, updateUser: () => { } };
    const useToast = () => useContext(ToastContext) || (() => { });

    /* ─── THEME ─── */
    const T = {
      orange: "#FF4F1F", orangeLt: "#FF7044", yellow: "#FFC700",
      black: "#111111", white: "#FFFFFF", gray: "#F5F5F5",
      border: "#EBEBEB", muted: "#888888", cardBg: "#FFFFFF",
      success: "#22C55E", rose: "#EF4444", indigo: "#6366F1",
      teal: "#14B8A6", warn: "#F59E0B", text: "#1A1A1A",
      purple: "#9B6DFF",
      /* Legacy aliases so Vidya-Setu logic keeps working */
      saffron: "#FF4F1F", saffronLt: "#FF7044", gold: "#FFC700",
      navy: "#111111", navyMid: "#F5F5F5", navyLt: "#F0F0F0",
    };

    /* ─── SHARED UI ─── */
    const Badge = ({ children, color = T.orange }) => (
      <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: color + "18", color, border: `1px solid ${color}38`, borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 700, letterSpacing: .4 }}>{children}</span>
    );

    const Card = ({ children, style = {}, onClick, className = "" }) => (
      <div className={`card-hover ${className}`} onClick={onClick}
        style={{ background: "#FFFFFF", borderRadius: 16, border: "1px solid #EBEBEB", padding: 18, boxShadow: "0 2px 14px rgba(0,0,0,0.05)", ...style }}>
        {children}
      </div>
    );

    const Btn = ({ children, onClick, variant = "primary", style = {}, disabled = false }) => {
      const V = {
        primary: { background: `linear-gradient(135deg,#FF4F1F 0%,#FF6B3D 50%,#FF8C42 100%)`, color: "#fff", border: "none", boxShadow: "0 4px 18px rgba(255,79,31,0.32), 0 1px 4px rgba(0,0,0,0.08)" },
        secondary: { background: "#F5F5F5", color: T.text, border: `1px solid #E2E2E2`, boxShadow: "0 1px 4px rgba(0,0,0,0.05)" },
        teal: { background: `linear-gradient(135deg,#14B8A6 0%,#0DD6C4 60%,#06B6AA 100%)`, color: "#fff", border: "none", boxShadow: "0 4px 16px rgba(20,184,166,0.28)" },
        ghost: { background: "rgba(255,79,31,0.06)", color: T.orange, border: `1px solid rgba(255,79,31,0.28)` },
      };
      return (
        <button className="btn-press ripple-btn" onClick={onClick} disabled={disabled}
          style={{
            ...V[variant], borderRadius: 10, padding: "11px 20px", fontSize: 14, fontWeight: 700,
            cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? .5 : 1, ...style
          }}>
          {children}
        </button>
      );
    };

    const SH = ({ icon, title, subtitle }) => (
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <span style={{ fontSize: 18, width: 34, height: 34, background: "rgba(255,79,31,0.07)", border: "1px solid rgba(255,79,31,0.15)", borderRadius: 9, display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{icon}</span>
          <h2 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 20, fontWeight: 800, color: T.text }}>{title}</h2>
        </div>
        {subtitle && <p style={{ color: T.muted, fontSize: 13, paddingLeft: 30 }}>{subtitle}</p>}
      </div>
    );

    const Modal = ({ open, onClose, title, children, aboveNav }) => {
      if (!open) return null;
      return (
        <div className={`modal-overlay ${aboveNav ? "above-nav-overlay" : ""}`} onClick={onClose}>
          <div className={`modal-sheet ${aboveNav ? "above-nav-sheet" : ""}`} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
              <h3 style={{ fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', fontSize: 20, fontWeight: 800, color: T.text }}>{title}</h3>
              <button onClick={onClose} style={{ background: "#F5F5F5", border: "1px solid #E8E8E8", color: "#999", borderRadius: 8, width: 32, height: 32, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", transition: "all .15s ease" }}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    const PBar = ({ value, color = T.orange, h = 8 }) => (
      <div style={{ background: "#F0F0F0", borderRadius: 99, height: h, overflow: "hidden" }}>
        <div className="prog-fill" style={{ width: `${value}%`, height: "100%", background: `linear-gradient(90deg,${color},${color}CC)`, borderRadius: 99 }} />
      </div>
    );

    const QR = ({ data, size = 96 }) => {
      const hash = data.split("").reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0);
      const g = 21, cell = size / g;
      let s = Math.abs(hash);
      const rng = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
      const cells = Array.from({ length: g }, (_, r) => Array.from({ length: g }, (_, c) => {
        if (r < 7 && c < 7) return r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        if (r < 7 && c > g - 8) return r === 0 || r === 6 || c === g - 1 || c === g - 7 || (r >= 2 && r <= 4 && c >= g - 5 && c <= g - 3);
        if (r > g - 8 && c < 7) return r === g - 1 || r === g - 7 || c === 0 || c === 6 || (r >= g - 5 && r <= g - 3 && c >= 2 && c <= 4);
        return rng() > .5;
      }));
      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <rect width={size} height={size} fill="white" rx={4} />
          {cells.map((row, r) => row.map((on, c) => on ? <rect key={r + "-" + c} x={c * cell} y={r * cell} width={cell} height={cell} fill="#111" /> : null))}
        </svg>
      );
    };

    const EDUCATIONAL_BOARDS = [
      "CBSE",
      "ICSE",
      "UP Board",
      "Maharashtra State Board",
      "Bihar Board",
      "Rajasthan Board",
      "Madhya Pradesh Board",
      "West Bengal Board",
      "Karnataka State Board",
      "Tamil Nadu State Board",
      "NIOS (National Institute of Open Schooling)",
      "Other State Board"
    ];

    /* ─── TOAST ─── */
    function ToastSystem({ toasts }) {
      return (
        <div className="toast-container">
          {toasts.map(t => (
            <div key={t.id} className="toast-anim" style={{
              background: "#fff",
              border: `1px solid ${(t.accent || T.orange)}28`,
              borderLeft: `3px solid ${t.accent || T.orange}`,
              borderRadius: 14, padding: "12px 16px",
              display: "flex", alignItems: "center", gap: 10,
              boxShadow: "0 8px 36px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06)",
              backdropFilter: "blur(20px)", pointerEvents: "auto", background: "rgba(255,255,255,0.97)"
            }}>
              <span style={{ fontSize: 20, flexShrink: 0 }}>{t.icon}</span>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 13, color: T.text, lineHeight: 1.2 }}>{t.title}</div>
                {t.sub && <div style={{ fontSize: 11, color: T.muted, marginTop: 3, lineHeight: 1.3 }}>{t.sub}</div>}
              </div>
            </div>
          ))}
        </div>
      );
    }


    /* ══════════════════════════════════════
      SPLASH SCREEN COMPONENT
    ══════════════════════════════════════ */
    function SplashScreen({ onDone }) {
      const [exiting, setExiting] = useState(false);
      useEffect(() => {
        const t1 = setTimeout(() => setExiting(true), 1800);
        const t2 = setTimeout(() => onDone(), 2300);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);
      return (
        <div className={`splash-screen ${exiting ? "exit" : ""}`}>
          <div className="splash-orb-1" />
          <div className="splash-orb-2" />
          <div className="splash-orb-3" />
          <div className="splash-logo-wrap">
            <div className="splash-logo-icon">
              <svg width="48" height="48" viewBox="0 0 44 44" fill="none">
                <defs>
                  <linearGradient id="splashNewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#FF4F1F" />
                    <stop offset="100%" stopColor="#FFC700" />
                  </linearGradient>
                </defs>
                <path d="M22 6 L6 14 L22 22 L38 14 Z" fill="url(#splashNewGrad)" opacity="0.95" />
                <path d="M10 18 V28 C10 32 16 36 22 38 C28 36 34 32 34 28 V18" stroke="url(#splashNewGrad)" strokeWidth="4" fill="none" strokeLinecap="round" />
                <path d="M22 22 V38" stroke="url(#splashNewGrad)" strokeWidth="4" strokeLinecap="round" />
              </svg>
            </div>
          </div>
          <div className="splash-title">
            <div className="splash-title-main">Vidya-Setu</div>
            <div className="splash-title-sub">Student Web Portal</div>
          </div>
          <div className="splash-loader">
            <div className="splash-loader-track">
              <div className="splash-loader-fill" />
            </div>
            <div className="splash-dots">
              <span /><span /><span />
            </div>
          </div>
        </div>
      );
    }

    /* ─── USER PROFILE MODAL ─── */
    function UserProfileModal({ open, onClose, onLogout }) {
      const { user, updateUser, refreshUser } = useUser();
      const addToast = useToast();
      const [draft, setDraft] = useState({});
      const [saved, setSaved] = useState(false);
      const [photoUploading, setPhotoUploading] = useState(false);
      const [showTfwPanel, setShowTfwPanel] = useState(false);
      const [confirmPassword, setConfirmPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [uploadedDocs, setUploadedDocs] = useState({});
      const photoInputRef = useRef(null);

      const isLocked = !!(user.profileEditedOnce);

      useEffect(() => {
        if (open) {
          refreshUser(); // Sync with backend on open to see if admin approved
          setDraft({ ...user });
          setSaved(false);
        }
      }, [open]);

      // When user context updates (e.g. from refreshUser), update the draft
      useEffect(() => {
        if (open) setDraft({ ...user });
      }, [user]);

      const handlePhotoUpload = async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        const file = e.target.files[0];
        if (file.size > 5 * 1024 * 1024) {
          addToast("File Too Large", "Please select an image under 5MB", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>error</span>, T.rose);
          return;
        }

        const reader = new FileReader();
        reader.onloadend = async () => {
          const base64 = reader.result;
          // Show preview immediately
          setDraft(p => ({ ...p, profilePhoto: base64 }));
          setPhotoUploading(true);

          try {
            const res = await fetch(`${API_BASE_URL}/api/users/upload-profile-photo`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rollNo: user.rollNo, photoData: base64 })
            });
            const data = await res.json();
            if (res.ok && data.profilePhoto) {
              const updatedUser = { ...user, profilePhoto: data.profilePhoto };
              updateUser(updatedUser); // ✅ STABLE VERSION: Automatically saves lean data
              setDraft(p => ({ ...p, profilePhoto: data.profilePhoto }));
              // Unsafe localStorage.setItem removed to prevent storage crash
              addToast("Photo Uploaded ✨", "Your profile photo is live!", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, T.success);
            } else {
              throw new Error(data.error || "Upload failed");
            }
          } catch (err) {
            addToast("Upload Failed", err.message, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>error</span>, T.rose);
            setDraft(p => ({ ...p, profilePhoto: user.profilePhoto || "" }));
          } finally {
            setPhotoUploading(false);
          }
        };
        reader.readAsDataURL(file);
      };

      const handleDocUpload = (field, e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        const file = e.target.files[0];
        if (file.size > 2 * 1024 * 1024) {
          addToast("File Too Large", "Please select a file under 2MB", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>error</span>, T.rose);
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          setDraft(p => ({ ...p, [field]: reader.result }));
          addToast("Document Selected", "File attached successfully. Don't forget to save.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>task</span>, T.teal);
        };
        reader.readAsDataURL(file);
      };


      /* ── TFW LIVE ELIGIBILITY CHECK (AKTU/UPTAC norms) ── */
      const tfwCriteria = [
        {
          id: 'income', label: 'Family income < ₹6,00,000/year', icon: 'currency_rupee',
          check: () => (parseInt(draft.familyIncome) || 0) < 600000
        },
        {
          id: 'domicile', label: 'Uttar Pradesh domicile', icon: 'location_on',
          check: () => draft.domicileState === 'Uttar Pradesh'
        },
        {
          id: 'cert', label: 'Valid Income Certificate', icon: 'description',
          check: () => !!draft.hasIncomeCertificate
        },
        {
          id: 'course', label: 'Eligible course (not B.Arch)', icon: 'school',
          check: () => draft.course !== 'B.Arch'
        }
      ];
      const tfwResults = tfwCriteria.map(c => ({ ...c, passed: c.check() }));
      const tfwEligible = tfwResults.every(c => c.passed);

      const saveProfile = async (e) => {
        if (e) e.preventDefault();
        if (isLocked) {
          addToast("Profile Locked 🔒", "Your profile can only be edited once.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>lock</span>, T.rose);
          return;
        }
        // Block save if TFW is on but not eligible
        if (draft.isFeeWaiver && !tfwEligible) {
          addToast("TFW Ineligible ❌", "Please fix the eligibility issues below before saving.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>error</span>, T.rose);
          return;
        }
        try {
          const payload = {
            name: draft.name || user.name || "",
            rollNo: draft.rollNo || user.rollNo || "",
            branch: draft.branch || user.branch || "",
            year: draft.year || user.year || "",
            familyIncome: parseInt(draft.familyIncome) || 0,
            isFeeWaiver: !!draft.isFeeWaiver,
            domicileState: draft.domicileState || "",
            hasIncomeCertificate: !!draft.hasIncomeCertificate,
            course: draft.course || "B.Tech",
            password: confirmPassword,
            mobileNumber: draft.mobileNumber || "",
          };

          const initials = payload.name ? payload.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase() : user.initials;

          if (!confirmPassword && !isLocked) {
            addToast("Password Required", "Please enter your password to save changes.", "🔑", T.orange);
            return;
          }

          const response = await fetch(`${API_BASE_URL}/api/users/update-profile`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            const updatedProfile = { ...user, ...draft, ...payload, initials, profileEditedOnce: true, rollNo: payload.rollNo };
            // updateUser already calls saveToStorage which is lean
            updateUser(updatedProfile);
            setSaved(true);
            addToast("Profile Saved & Locked ✨", `Your profile is now final, ${payload.name}!`, <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>verified</span>, T.orange);
            setTimeout(onClose, 900);
          } else {
            const err = await response.json();
            if (err.reasons && err.reasons.length) {
              alert('TFW Eligibility Failed:\n\n' + err.reasons.map((r, i) => `${i + 1}. ${r}`).join('\n'));
            } else {
              alert('Error: ' + (err?.error || 'Failed to update profile.'));
            }
          }
        } catch (error) {
          if (error.message.includes('Failed to fetch')) {
            alert('Network Error: Could not reach backend at ' + API_BASE_URL + '/api/users/update-profile — Please verify HTTPS is enabled and the server is live.');
          } else {
            alert('Error: ' + error.message);
          }
        }
      };

      const requestUnlock = async () => {
        try {
          const res = await fetch(`${API_BASE_URL}/api/users/request-profile-unlock`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rollNo: user.rollNo })
          });
          const data = await res.json();
          if (data.success) {
            // Update local state and storage immediately
            updateUser({ profileEditRequested: true });
            addToast("Request Sent", "Admin will review your request to unlock profile.", <span className="material-symbols-outlined" style={{ verticalAlign: 'middle', fontSize: '1.2em' }}>check_circle</span>, T.indigo);
          } else {
            addToast("Request Failed", data.error || "Could not send request.", "⚠️", T.rose);
          }
        } catch (err) {
          addToast("Network Error", "Is the backend server running?", "❌", T.rose);
        }
      };

      const handleRefreshStatus = async () => {
        addToast("Syncing...", "Checking for admin approval", "⏳", T.teal);
        await refreshUser();
      };

      const inp = { width: "100%", padding: "11px 14px", background: T.gray, color: T.text, border: `1px solid ${T.border}`, borderRadius: 9, fontSize: 14, fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif', marginTop: 6 };
      const inpLocked = { ...inp, background: "#F0F0F0", color: "#999", cursor: "not-allowed", pointerEvents: "none" };
      const lbl = { color: T.muted, fontSize: 11, fontWeight: 700, letterSpacing: .8, textTransform: "uppercase" };

      const currentPhoto = draft.profilePhoto || user.profilePhoto;
      const fieldStyle = isLocked ? inpLocked : inp;

      if (!open) return null;
      return (
        <Modal open={open} onClose={onClose} title="👤 My Profile">
          <div className="profile-pop" style={{ display: "flex", flexDirection: "column", gap: 16, paddingBottom: 8 }}>

            {/* ⚠️ PERMANENT LOCK WARNING */}
            {!isLocked && (
              <div style={{
                padding: "12px 16px", borderRadius: 12,
                background: "rgba(255,199,0,0.08)",
                border: "1px dashed #F59E0B",
                display: "flex", gap: 12, alignItems: "center",
                animation: "fadeIn 0.4s ease"
              }}>
                <span style={{ fontSize: 20 }}>⚠️</span>
                <div style={{ color: "#92400E", fontSize: 12, lineHeight: 1.4 }}>
                  <b>Warning:</b> After saving, your profile will be permanently locked and cannot be edited again. Please double-check all details.
                </div>
              </div>
            )}

            {/* 🔒 PROFILE LOCK BANNER */}
            {isLocked && (
              <div style={{
                display: "flex", alignItems: "center", gap: 12,
                padding: "14px 18px", borderRadius: 13,
                background: "linear-gradient(135deg, rgba(239,68,68,0.06), rgba(255,152,0,0.04))",
                border: "1.5px solid rgba(239,68,68,0.22)",
